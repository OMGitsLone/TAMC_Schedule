<title>TAMC ED Shift Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a macOS-style window — translucent toolbar with a segmented control, grouped content panels, one dense scrolling grid. */
:root {
  --bg: #ececec;
  --panel: #ffffff;
  --panel-2: #f5f5f7;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: #e0e0e3;
  --accent: #007aff;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 122, 255, .12);
  --toolbar: rgba(246, 246, 246, .82);
  --seg: rgba(118, 118, 128, .12);
  --seg-on: #ffffff;
  --ok: #248a3d;   --ok-bg: rgba(52, 199, 89, .16);
  --warn: #b25000; --warn-bg: rgba(255, 149, 0, .18);
  --crit: #d70015; --crit-bg: rgba(255, 59, 48, .14);
  --day: rgba(255, 204, 0, .28);   --day-ink: #8a6100;
  --night: #5856d6; --night-ink: #ffffff;
  --swing: rgba(175, 82, 222, .18); --swing-ink: #8944ab;
  --edu: rgba(52, 199, 89, .18);   --edu-ink: #248a3d;
  --pto: rgba(142, 142, 147, .18); --pto-ink: #48484a;
  --off: #ffffff;   --off-ink: #8e8e93;
  --weekend: #fafafa;
  --today: #007aff;
  --shadow: 0 0 0 .5px rgba(0,0,0,.12), 0 12px 40px rgba(0,0,0,.18);
  --ctl-shadow: 0 0 0 .5px rgba(0,0,0,.14), 0 1px 1.5px rgba(0,0,0,.08);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1e1e1e; --panel: #2a2a2c; --panel-2: #323234; --ink: #f5f5f7; --muted: #98989d; --line: #3a3a3c;
  --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, .22);
  --toolbar: rgba(40, 40, 42, .82); --seg: rgba(118, 118, 128, .24); --seg-on: #636366;
  --ok: #30d158; --ok-bg: rgba(48, 209, 88, .18); --warn: #ff9f0a; --warn-bg: rgba(255, 159, 10, .2); --crit: #ff453a; --crit-bg: rgba(255, 69, 58, .2);
  --day: rgba(255, 214, 10, .22); --day-ink: #ffd60a; --night: #5e5ce6; --night-ink: #ffffff; --swing: rgba(191, 90, 242, .24); --swing-ink: #da8fff;
  --edu: rgba(48, 209, 88, .2); --edu-ink: #30d158; --pto: rgba(142, 142, 147, .24); --pto-ink: #d1d1d6; --off: #2a2a2c; --off-ink: #98989d;
  --weekend: #2f2f31; --today: #0a84ff; --shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.55);
  --ctl-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 1px 1.5px rgba(0,0,0,.3); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #1e1e1e; --panel: #2a2a2c; --panel-2: #323234; --ink: #f5f5f7; --muted: #98989d; --line: #3a3a3c;
  --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, .22);
  --toolbar: rgba(40, 40, 42, .82); --seg: rgba(118, 118, 128, .24); --seg-on: #636366;
  --ok: #30d158; --ok-bg: rgba(48, 209, 88, .18); --warn: #ff9f0a; --warn-bg: rgba(255, 159, 10, .2); --crit: #ff453a; --crit-bg: rgba(255, 69, 58, .2);
  --day: rgba(255, 214, 10, .22); --day-ink: #ffd60a; --night: #5e5ce6; --night-ink: #ffffff; --swing: rgba(191, 90, 242, .24); --swing-ink: #da8fff;
  --edu: rgba(48, 209, 88, .2); --edu-ink: #30d158; --pto: rgba(142, 142, 147, .24); --pto-ink: #d1d1d6; --off: #2a2a2c; --off-ink: #98989d;
  --weekend: #2f2f31; --today: #0a84ff; --shadow: 0 0 0 .5px rgba(255,255,255,.12), 0 12px 40px rgba(0,0,0,.55);
  --ctl-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 1px 1.5px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--toolbar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
.top-inner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(180deg, #4da3ff, #0064e0); box-shadow: var(--ctl-shadow); display: grid; place-items: center; flex: none; }
.brand-mark svg { display: block; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .01em; line-height: 1; }
.brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
.top-tools { order: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.period { display: flex; align-items: center; gap: 4px; }
.period-label { font-family: var(--f-display); font-weight: 600; font-size: 16px; padding: 0 6px; white-space: nowrap; }
.iconbtn { border: 0; box-shadow: var(--ctl-shadow); background: var(--panel); border-radius: 6px; width: 26px; height: 24px; display: grid; place-items: center; }
.iconbtn:hover { background: var(--panel-2); }
label.inline { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
select, input[type=text], input[type=date], input[type=number], textarea { background: var(--panel); border: 0; box-shadow: var(--ctl-shadow); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
input:focus, select:focus, textarea:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.tabs { order: 2; display: flex; gap: 2px; overflow-x: auto; max-width: 100%; margin: 0 auto; padding: 2px; border-radius: 8px; background: var(--seg); scrollbar-width: none; }
.tab { border: 0; background: none; padding: 4px 14px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; display: flex; align-items: center; gap: 7px; }
.tab[hidden] { display: none; }
.tab[aria-selected=true] { background: var(--seg-on); box-shadow: var(--ctl-shadow); }
.tab .count { font-size: 11px; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 9px; background: var(--seg); color: var(--muted); }
.tab .count.hot { background: var(--crit); color: #ffffff; }

main { padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.banner { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 14px; color: var(--muted); font-size: 13px; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.panel { background: var(--panel); border: 0; box-shadow: var(--ctl-shadow); border-radius: 12px; min-width: 0; overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-size: 18px; font-weight: 600; text-wrap: balance; }
.panel-head .sub { color: var(--muted); font-size: 12px; }
.panel-head .spacer { flex: 1; }
.panel-body { padding: 14px; }
.btn { border: 0; box-shadow: var(--ctl-shadow); background: var(--panel); border-radius: 6px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 85%, #fff), var(--accent)); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 2px 9px; font-size: 12px; }
.btn.danger { color: var(--crit); }
.eyebrow { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--muted); font-weight: 600; }

/* Legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.chip { display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 4px; border-radius: 5px; font-family: var(--f-display); font-weight: 600; font-size: 11.5px; }
.s-day { background: var(--day); color: var(--day-ink); }
.s-night { background: var(--night); color: var(--night-ink); }
.s-ot { box-shadow: inset 0 0 0 1.5px var(--crit); }
.s-charge { box-shadow: inset 0 0 0 1.5px currentColor; }
.s-swing { background: var(--swing); color: var(--swing-ink); }
.s-edu { background: var(--edu); color: var(--edu-ink); }
.s-adm { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.s-pto { background: repeating-linear-gradient(135deg, var(--pto) 0 4px, transparent 4px 7px), var(--pto); color: var(--pto-ink); }
.s-oc { background: transparent; color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.s-off { background: var(--off); color: var(--off-ink); box-shadow: inset 0 0 0 1px var(--line); }

/* Grid */
.grid-wrap { overflow: auto; max-height: calc(100vh - 200px); min-height: 320px; }
table.grid { border-collapse: separate; border-spacing: 0; font-size: 12px; }
.grid th, .grid td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); padding: 0; height: 30px; background: var(--panel); }
.grid thead th { position: sticky; z-index: 3; background: var(--panel-2); font-weight: 500; }
.grid thead tr.weeks th { top: 0; height: 24px; font-family: var(--f-display); font-weight: 600; font-size: 12px; color: var(--muted); text-align: left; padding-left: 8px; }
.grid thead tr.days th { top: 24px; height: 38px; text-align: center; min-width: 36px; width: 36px; }
.grid thead tr.days th .dow { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.grid thead tr.days th .dn { font-family: var(--f-mono); font-size: 12px; }
.grid thead th.today { box-shadow: inset 0 -3px 0 var(--today); }
.grid .name { position: sticky; left: 0; z-index: 2; min-width: 190px; max-width: 190px; text-align: left; padding: 0 8px; background: var(--panel); }
.grid thead .name { z-index: 4; }
.grid .name .nm { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.grid .name .meta { display: block; color: var(--muted); font-size: 11px; white-space: nowrap; }
.grid .name.me .nm::after { content: "you"; margin-left: 6px; font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.grid .tot { position: sticky; right: 0; z-index: 2; min-width: 58px; text-align: right; padding: 0 8px; background: var(--panel-2); }
.grid thead .tot { z-index: 4; }
.grid tr.group th { position: sticky; left: 0; text-align: left; padding: 6px 8px 4px; background: var(--bg); font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .02em; height: auto; border-right: 0; }
.grid tr.group td { background: var(--bg); border-right: 0; }
.grid td.wkend, .grid th.wkend { background: var(--weekend); }
.grid td.wkstart, .grid th.wkstart { border-left: 2px solid var(--line); }
.grid td.ppstart, .grid th.ppstart { border-left: 2px solid var(--muted); }
.cell { width: 100%; height: 100%; border: 0; background: transparent; padding: 3px; display: grid; place-items: center; position: relative; }
.cell:hover { background: var(--accent-soft); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
.cell .chip { width: 100%; height: 100%; min-width: 0; }
.cell .flag { position: absolute; top: 1px; right: 1px; width: 0; height: 0; border-top: 7px solid var(--crit); border-left: 7px solid transparent; }
.cell .flag.warn { border-top-color: var(--warn); }
.cell.pending::after, .cell.offered::after { content: ""; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: var(--warn); }
.cell.offered::after { background: var(--accent); }
.cell.changed::before { content: ""; position: absolute; left: 1px; bottom: 1px; width: 0; height: 0; border-bottom: 7px solid var(--accent); border-right: 7px solid transparent; }
.grid tfoot td, .grid tfoot th { background: var(--panel-2); }
.grid tfoot th.name { position: sticky; left: 0; }
.grid tfoot th.name { z-index: 4; font-size: 12px; font-weight: 500; }
.cov { font-family: var(--f-mono); font-size: 11px; text-align: center; display: grid; place-items: center; height: 100%; }
.cov.short { background: var(--crit-bg); color: var(--crit); font-weight: 600; }
.cov.over { background: var(--warn-bg); color: var(--warn); }
.cov.met { color: var(--ok); }
.ot { color: var(--warn); font-weight: 600; }

/* Popover */
.pop { position: fixed; z-index: 50; background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 10px; width: 250px; }
.pop h3 { margin: 0 0 2px; font-family: var(--f-display); font-size: 15px; }
.pop .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
.pop .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.pop .opt { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 4px; display: grid; gap: 2px; justify-items: center; font-size: 10.5px; color: var(--muted); }
.pop .opt:hover, .pop .opt.cur { border-color: var(--accent); }
.pop .issues { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12px; display: grid; gap: 4px; }
.pop .issues li { padding: 5px 7px; border-radius: 5px; background: var(--crit-bg); color: var(--crit); }
.pop .issues li.warn { background: var(--warn-bg); color: var(--warn); }
.pop .row { display: flex; justify-content: space-between; margin-top: 8px; gap: 6px; }
.kbd { font-family: var(--f-mono); font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; }

/* Coverage */
.cov-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .cov-layout { grid-template-columns: minmax(0, 1fr); } }
/* Schedule sub-views */
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: var(--seg); }
.seg button { border: 0; background: none; padding: 3px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; }
.seg button[aria-pressed=true] { background: var(--seg-on); box-shadow: var(--ctl-shadow); }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .dh { padding: 6px 8px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.cal .pp { grid-column: 1 / -1; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--panel-2); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cal .pp b { color: var(--ink); font-weight: 600; }
.cal .pp .ot { color: var(--warn); }
.cell.calday { display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 4px; min-height: 86px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); text-align: left; min-width: 0; }
.cell.calday:nth-child(7n) { border-right: 0; }
.calday .dnum { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; align-self: flex-start; padding: 0 5px; border-radius: 10px; }
.calday.today .dnum { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
.calday.past { opacity: .5; }
.calday.wkend { background: var(--weekend); }
.calday .shift { border-radius: 6px; padding: 4px 6px; font-size: 12px; font-weight: 600; line-height: 1.25; overflow: hidden; }
.calday .shift small { display: block; font-weight: 400; font-size: 11px; opacity: .85; font-variant-numeric: tabular-nums; }
.calday .flag { top: 4px; right: 4px; }
/* Daily roster */
.daycols { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; padding: 12px 14px; }
.daycol { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.daycol h3 { margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.daycol h3 .sub { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.cell.dayp { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; height: auto; padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink); }
.cell.dayp:last-child { border-bottom: 0; }
.cell.dayp .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.cell.dayp .flag { top: 3px; right: 3px; }
.cell.dayp.pending::after, .cell.dayp.offered::after { left: auto; right: 6px; bottom: 4px; transform: none; }
.daycov { width: 100%; border-collapse: collapse; font-size: 13px; }
.daycov th, .daycov td { padding: 6px 14px; border-bottom: 1px solid var(--line); text-align: left; }
.daycov th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--panel-2); }
.daycov .cov { display: inline-block; min-width: 44px; padding: 2px 6px; border-radius: 5px; }
.offlist { padding: 0 14px 12px; }
.offlist summary { cursor: pointer; padding: 8px 0; color: var(--muted); font-size: 13px; }
.offlist .daycols { padding: 0; }
@media (max-width: 640px) { .cell.calday { min-height: 62px; padding: 4px 3px; } .calday .shift { padding: 3px 4px; font-size: 11px; } .calday .shift small { display: none; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--panel); padding: 10px 14px; }
.stat b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat b.bad { color: var(--crit); }
.stat span { font-size: 12px; color: var(--muted); }
.chart-box { overflow-x: auto; }
.chart-box svg { display: block; min-width: 620px; width: 100%; height: auto; }
.chart-box text { fill: var(--muted); font-family: var(--f-mono); font-size: 10px; }
.gantt { overflow-x: auto; }
.gantt-inner { min-width: 620px; display: grid; gap: 3px; }
.g-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 8px; font-size: 12px; }
.g-row .who { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-row .who small { color: var(--muted); }
.g-track { position: relative; height: 18px; background: repeating-linear-gradient(90deg, var(--panel-2) 0 calc(100%/24 - 1px), var(--line) calc(100%/24 - 1px) calc(100%/24)); border-radius: 3px; }
.g-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; font-family: var(--f-display); font-weight: 700; font-size: 11px; padding-left: 5px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
.g-axis { display: grid; grid-template-columns: 150px 1fr; gap: 8px; font-family: var(--f-mono); font-size: 10px; color: var(--muted); }
.g-axis div:last-child { display: flex; justify-content: space-between; }
.targets { display: grid; gap: 8px; }
.targets table { width: 100%; border-collapse: collapse; font-size: 13px; }
.targets th, .targets td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.targets input { width: 56px; }

/* Lists */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 900px) { .two { grid-template-columns: minmax(0, 1fr); } }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .grow { flex: 1; min-width: 180px; }
.list .ttl { font-weight: 500; }
.list .det { color: var(--muted); font-size: 12px; }
.mgrs { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 8px; max-height: 240px; overflow: auto; }
.mgrs li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.mgrs li:last-child { border-bottom: 0; }

<script>
(() => {
'use strict';

// ---------- Constants ----------
const ANCHOR = '2026-11-01';          // first day of a 6-week period (a Sunday)
const PERIOD_DAYS = 42;
// Pay periods: 80 hours every 2 weeks, starting Nov 1, 2026 (three per schedule period).
const PAY_DAYS = 14;
const PAY_HOURS = 80;
const ROLES = ['Doctor', 'PA', 'RN', 'LPN', 'Medic', 'MSA', 'Admin', 'Supply', 'Dispatcher'];
const REQUIRED_CREDS = {
  'Doctor': ['BLS', 'ACLS', 'PALS'],
  'PA': ['BLS', 'ACLS', 'PALS'],
  'RN': ['BLS', 'ACLS', 'PALS'],
  'LPN': ['BLS'],
  'Medic': ['BLS', 'NREMT'],
  'MSA': [],
  'Admin': [],
  'Supply': [],
  'Dispatcher': []
};
// Charge is a shift an RN works, not a role. Coverage counts it as its own line, ahead of RN.
const COV_GROUPS = ROLES.flatMap(r => r === 'RN' ? ['Charge', 'RN'] : [r]);
const CHARGE_CREDS = ['TNCC'];
const ALL_CREDS = ['BLS', 'ACLS', 'PALS', 'ATLS', 'TNCC', 'ENPC', 'CEN', 'NREMT'];
// Working shifts belong to set roles; Education, Leave, On call and RDO are open to everyone.
const SHIFT_ROLES = ['RN', 'Medic'];
const PROVIDERS = ['Doctor', 'PA'];
const SUPPORT = ['MSA', 'Admin', 'Dispatcher'];
const SHIFTS = {
  // start and len are in hours; 5.75 is 0545. paid leaves out the unpaid 30-minute meal break.
  D:   { label: 'Day 0545–1815',   start: 5.75,  len: 12.5, paid: 12, cls: 's-day',   duty: true,  roles: [...SHIFT_ROLES, 'LPN'], key: 'd' },
  N:   { label: 'Night 1745–0615', start: 17.75, len: 12.5, paid: 12, cls: 's-night', duty: true,  roles: [...SHIFT_ROLES, 'LPN'], key: 'n' },
  CD:  { label: 'Charge Day 0530–1815',   start: 5.5,  len: 12.75, paid: 12, cls: 's-day s-charge',   duty: true, charge: true, roles: ['RN'], key: 'c' },
  CN:  { label: 'Charge Night 1730–0615', start: 17.5, len: 12.75, paid: 12, cls: 's-night s-charge', duty: true, charge: true, roles: ['RN'], key: 'h' },
  // S and E8 stay as the stored codes so saved schedules keep working; `show` is what people see.
  S:   { label: 'Mid 1100–2300',   start: 11, len: 12, cls: 's-swing', duty: true,  roles: SHIFT_ROLES, key: 'm', show: 'M' },
  D8:  { label: 'Day 0700–1500',   start: 7,  len: 8,  cls: 's-day',   duty: true,  roles: SHIFT_ROLES, key: '8' },
  E8:  { label: 'Late 1500–2300',  start: 15, len: 8,  cls: 's-swing', duty: true,  roles: SHIFT_ROLES, key: 'l', show: 'L8' },
  // Doctors and PAs: 10-hour provider shifts.
  PD:  { label: 'Main Pit Day 0600–1600',   start: 6,  len: 10, cls: 's-day',   duty: true, roles: PROVIDERS, key: 'd' },
  PM:  { label: 'Main Pit Mid 1400–2400',   start: 14, len: 10, cls: 's-swing', duty: true, roles: PROVIDERS, key: 'm' },
  PN:  { label: 'Main Pit Night 2200–0800', start: 22, len: 10, cls: 's-night', duty: true, roles: PROVIDERS, key: 'n' },
  TR:  { label: 'Triage 1000–2000',         start: 10, len: 10, cls: 's-day',   duty: true, roles: PROVIDERS, key: 't' },
  FX:  { label: 'Flex 1000–2000',           start: 10, len: 10, cls: 's-swing', duty: true, roles: PROVIDERS, key: 'f' },
  // MSA, Admin and Dispatcher.
  MD:  { label: 'MSA Day 0545–1815',   start: 5.75,  len: 12.5, paid: 12, cls: 's-day',   duty: true, roles: SUPPORT, key: 'd' },
  MN:  { label: 'MSA Night 1745–0615', start: 17.75, len: 12.5, paid: 12, cls: 's-night', duty: true, roles: SUPPORT, key: 'n' },
  // Supply works one 8-hour day; no times are shown, coverage treats it as 0800–1600.
  SD:  { label: 'Day', start: 8, len: 8, cls: 's-day', duty: true, roles: ['Supply'], key: 'd', show: 'D' },
  // Overtime: an extra shift at the role's own Day times, shown as OT and counted toward day coverage.
  OT:  { label: 'Overtime 0545–1815', start: 5.75, len: 12.5, paid: 12, cls: 's-day s-ot', duty: true, roles: [...SHIFT_ROLES, 'LPN'], key: 'v', show: 'OT' },
  OTP: { label: 'Overtime 0600–1600', start: 6,    len: 10,             cls: 's-day s-ot', duty: true, roles: PROVIDERS,           key: 'v', show: 'OT' },
  OTM: { label: 'Overtime 0545–1815', start: 5.75, len: 12.5, paid: 12, cls: 's-day s-ot', duty: true, roles: SUPPORT,             key: 'v', show: 'OT' },
  OTS: { label: 'Overtime',           start: 8,    len: 8,              cls: 's-day s-ot', duty: true, roles: ['Supply'],          key: 'v', show: 'OT' },
  EDU: { label: 'Education 8h',    start: 8,  len: 8,  cls: 's-edu',   duty: false, worked: true, key: 'u' },
  // Admin time: open to every role, 8 paid hours, no times shown and not counted toward coverage.
  ADM: { label: 'Admin',           len: 8,  cls: 's-adm',   duty: false, worked: true, key: 'a' },
  // A shift someone called off or was sick for; set from the cell menu, which also records it for the Call-offs report.
  CO:  { label: 'Called off',      len: 0,  cls: 's-co',    duty: false, show: 'CO' },
  PTO: { label: 'Leave',           len: 12, cls: 's-pto', duty: false, key: 'p', show: 'LV' },
  OC:  { label: 'On call (night)', len: 0,  cls: 's-oc',  duty: false, key: 'o' },
  X:   { label: 'RDO',             len: 0,  cls: 's-off', duty: false, key: 'x', show: 'RDO' }
};
const CODES = Object.keys(SHIFTS);
const shiftOk = (code, role) => !SHIFTS[code]?.roles || SHIFTS[code].roles.includes(role);
// The shift an open day or night slot is filled with, per coverage line; null when the role has none.
function bandCode(group, band) {
  if (group === 'Charge') return band === 'day' ? 'CD' : 'CN';
  const want = band === 'day' ? ['D', 'MD', 'PD', 'SD'] : ['N', 'MN', 'PN'];
  return want.find(c => shiftOk(c, group)) || null;
}
const REQ_TYPES = { pickup: 'Pick up', swap: 'Swap', giveaway: 'Give away', timeoff: 'Time off' };
const VIEWS = ['schedule', 'coverage', 'requests', 'rules', 'staff', 'reports'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// ---------- Date helpers (UTC, no DST surprises) ----------
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const fmt = d => d.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = parse(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const dow = s => parse(s).getUTCDay();
const nice = s => { const d = parse(s); return `${DOW[d.getUTCDay()]} ${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const short = s => { const d = parse(s); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const todayStr = (() => { const t = new Date(); return fmt(new Date(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()))); })();
const periodOf = s => addDays(ANCHOR, Math.floor(diffDays(ANCHOR, s) / PERIOD_DAYS) * PERIOD_DAYS);
const periodDays = p => Array.from({ length: PERIOD_DAYS }, (_, i) => addDays(p, i));
const payStartOf = s => addDays(ANCHOR, Math.floor(diffDays(ANCHOR, s) / PAY_DAYS) * PAY_DAYS);
const isPayStart = s => payStartOf(s) === s;
const span = (a, b) => Array.from({ length: diffDays(a, b) + 1 }, (_, i) => addDays(a, i));
// Visible range: 'day' = one day, 'pp' = one 2-week pay period, 'month' = calendar month, '6w' = the 6-week schedule period.
function visDays() {
  const c = state.cursor;
  if (state.range === 'day') return [c];
  if (state.range === 'pp') return span(payStartOf(c), addDays(payStartOf(c), PAY_DAYS - 1));
  if (state.range === 'month') { const d = parse(c); const first = fmt(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1))); return span(first, fmt(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)))); }
  return periodDays(periodOf(c));
}
// Whole pay periods that cover the visible days (overtime and rule checks always look at full pay periods).
function payPeriodsIn(days) {
  const starts = [...new Set(days.map(payStartOf))];
  return starts.map(p => span(p, addDays(p, PAY_DAYS - 1)));
}
const scopeDays = () => payPeriodsIn(visDays()).flat();
function stepRange(dir) {
  const days = visDays();
  if (state.range === 'month') { const d = parse(days[0]); state.cursor = fmt(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + dir, 1))); }
  else state.cursor = addDays(days[0], dir * days.length);
}
// US federal holidays on their calendar dates (the ED staffs the day itself, not the observed day off).
const holCache = {};
function holidays(year) {
  if (holCache[year]) return holCache[year];
  const day = (m, d) => fmt(new Date(Date.UTC(year, m, d)));
  const nth = (m, wd, n) => day(m, 1 + (wd - new Date(Date.UTC(year, m, 1)).getUTCDay() + 7) % 7 + (n - 1) * 7);
  const last = (m, wd) => { const end = new Date(Date.UTC(year, m + 1, 0)); return day(m, end.getUTCDate() - (end.getUTCDay() - wd + 7) % 7); };
  return holCache[year] = {
    [day(0, 1)]: "New Year's Day", [nth(0, 1, 3)]: 'Martin Luther King Jr. Day', [nth(1, 1, 3)]: "Presidents' Day", [last(4, 1)]: 'Memorial Day',
    [day(5, 19)]: 'Juneteenth', [day(6, 4)]: 'Independence Day', [nth(8, 1, 1)]: 'Labor Day', [nth(9, 1, 2)]: 'Columbus Day',
    [day(10, 11)]: 'Veterans Day', [nth(10, 4, 4)]: 'Thanksgiving', [day(11, 25)]: 'Christmas Day'
  };
}
const holidayOf = d => holidays(+d.slice(0, 4))[d] || '';
const isWeekend = d => dow(d) === 0 || dow(d) === 6;
const addMonths = (s, n) => { const d = parse(s); return fmt(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, d.getUTCDate()))); };

// ---------- Storage (per-viewer conveniences only) ----------
const ls = {
  get(k, f) { try { const v = localStorage.getItem('edsb:' + k); return v == null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem('edsb:' + k, JSON.stringify(v)); } catch {} }
};

// ---------- State ----------

const schedSubs = {};

async function boot() {
  render();

  const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  state.db = db; state.user = user;
  if (user) {
    try { state.isEditor = !!(await user.canEdit()); } catch { state.isEditor = false; }
    try { state.myId = await user.id(); } catch { state.myId = null; }
    state.canManage = state.isEditor;
  }
  if (!db) { state.loaded = true; render(); return; }
  state.live = true;
  // Owners and editors are always managers; access/managers adds people chosen by id.
  db.doc('access/managers').onSnapshot(snap => {
    state.managers = snap.exists ? (snap.data().ids || []) : [];
    state.canManage = state.isEditor || (!!state.myId && state.managers.includes(state.myId));
    render(); if (mgrModal) mgrModal.refresh();
  });
  // Everyone who opens the board and picks a name is listed here, so managers can be chosen by account.
  db.collection('people').onSnapshot(snap => { state.people = snap.docs.map(d => ({ id: d.id, ...d.data() })); registerMe(); });
  db.collection('staff').onSnapshot(snap => {
    state.staff = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loaded = true; render(); if (state.people.length || state.myId) registerMe();
  }, () => { state.loaded = true; render(); });
  db.collection('requests').onSnapshot(snap => {
    state.requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
  db.doc('config/unit').onSnapshot(snap => { state.config = snap.exists ? { ...DEFAULT_CONFIG, ...snap.data() } : null; render(); });
  db.doc('config/patterns').onSnapshot(snap => { state.patterns = snap.exists ? (snap.data().list || []) : []; });
  db.collection('periods').onSnapshot(snap => { const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); state.periods = m; render(); });
  db.collection('notes').onSnapshot(snap => { state.notes = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  db.collection('calloffs').onSnapshot(snap => { state.calloffs = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); });

}
function subscribeSchedule() {
  if (!state.db) return;
  // Schedules are stored per 6-week period; listen to every period the visible pay periods touch.
  const need = new Set([...scopeDays().map(periodOf), ...state.extraPeriods]);
  Object.keys(schedSubs).forEach(p => { if (!need.has(p)) { schedSubs[p](); delete schedSubs[p]; delete state.rowsBy[p]; delete state.existBy[p]; } });
  need.forEach(p => {
    if (schedSubs[p]) return;
    schedSubs[p] = state.db.collection('sched').where('period', '==', p).onSnapshot(snap => {
      if (!schedSubs[p]) return;
      const rows = {}, exists = {};
      snap.docs.forEach(d => { const v = d.data(); rows[v.staffId] = { ...(v.days || {}) }; exists[v.staffId] = true; });
      state.rowsBy[p] = rows; state.existBy[p] = exists; render();
    });
  });
}

function registerMe() {
  if (!state.db || !state.myId) return;
  const mine = state.people.find(p => p.id === state.myId);
  const staffId = staffById(state.me) ? state.me : '';
  if (mine && mine.staffId === staffId) return;
  const doc = { staffId, seen: todayStr };
  state.people = [...state.people.filter(p => p.id !== state.myId), { id: state.myId, ...doc }];
  queued('people/' + state.myId, () => state.db.doc('people/' + state.myId).set(doc)).catch(() => {});
}
// Accounts to pick from: people who have opened the board, plus organization search matches.
async function accountCandidates(q) {
  const ql = q.toLowerCase();
  const ps = state.people.length ? await state.user.profiles(state.people.map(p => p.id)) : {};
  let list = state.people.map(p => ({ p: ps[p.id] || { id: p.id, name: '', avatarUrl: '' }, staffId: p.staffId || '' }));
  if (q) list = list.filter(x => (x.p.name || '').toLowerCase().includes(ql) || (staffById(x.staffId)?.name || '').toLowerCase().includes(ql));
  const found = q ? await state.user.search(q) : [];
  found.forEach(f => { if (!list.some(x => x.p.id === f.id)) list.push({ p: f, staffId: state.people.find(x => x.id === f.id)?.staffId || '' }); });
  return list;
}
function accountLabel(x) {

}

// Each 6-week schedule is a draft (managers only), open for self-scheduling, or posted. Periods never set are posted.
const periodState = p => (state.periods[p] && state.periods[p].state) || 'posted';
function codeAt(staffId, date) { if (!state.canManage && periodState(periodOf(date)) === 'draft') return ''; return ((state.rowsBy[periodOf(date)] || {})[staffId] || {})[date] || ''; }

async function setCell(staffId, date, code) {
  const period = periodOf(date);
  const before = codeAt(staffId, date);
  const rows = state.rowsBy[period] || (state.db ? null : (state.rowsBy[period] = {}));
  if (rows) {
    rows[staffId] = { ...(rows[staffId] || {}), [date]: code };
    render();
  }
  if (!state.db) return;
  if (before !== code) logChange(staffId, date, before, code);
  if (before === 'CO' && code !== 'CO') dropCalloff(staffId, date);
  const path = `sched/${period}_${staffId}`;
  return queued(path, async () => {
    const ref = state.db.doc(path);
    const ex = state.existBy[period];
    const known = ex ? ex[staffId] : (await ref.get()).exists;
    if (known) await ref.update({ days: { [date]: code } });
    else { await ref.set({ period, staffId, days: { [date]: code } }); if (ex) ex[staffId] = true; }
  }).catch(writeFailed);
}

// Every schedule edit is logged; edits to a posted schedule are marked on the cell and reach that person's notifications.
function logChange(staffId, date, from, to) {
  const id = 'c' + Date.now().toString(36) + uid().slice(0, 4);
  const doc = { staffId, date, from: from || '', to: to || '', at: new Date().toISOString(), by: state.myId || '', byStaff: state.me || '' };
  state.changes = [{ id, ...doc }, ...state.changes];
  queued('changes/' + id, () => state.db.doc('changes/' + id).set(doc)).catch(() => {});
}
function postedChange(c) { const p = state.periods[periodOf(c.date)]; return !!(p && p.state === 'posted' && p.postedAt && c.at > p.postedAt); }

function markCalloff(staffId, date, kind) {

  state.calloffs = [...state.calloffs.filter(c => c.id !== id), { id, ...doc }];
  setCell(staffId, date, 'CO');
  saveDoc('calloffs/' + id, doc, false);

async function saveDoc(path, data, merge) {

// ---------- Derived data ----------
function staffById(id) { return state.staff.find(s => s.id === id); }
// Sort orders for the Staff & credentials table.
const STAFF_SORTS = {
  'role':       ['Role (unit order)', (a, b) => ROLES.indexOf(a.role) - ROLES.indexOf(b.role) || byName(a, b)],
  'role-az':    ['Role A–Z',          (a, b) => String(a.role).localeCompare(String(b.role)) || byName(a, b)],
  'role-za':    ['Role Z–A',          (a, b) => String(b.role).localeCompare(String(a.role)) || byName(a, b)],
  'name-az':    ['Name A–Z',          (a, b) => byName(a, b)],
  'name-za':    ['Name Z–A',          (a, b) => byName(b, a)],
  'last-az':    ['Last name A–Z',     (a, b) => lastName(a).localeCompare(lastName(b)) || byName(a, b)]
};
const byName = (a, b) => String(a.name).localeCompare(String(b.name));
const lastName = s => String(s.name).trim().split(/\s+/).pop();
function sortedStaff() {
  return [...state.staff].sort((a, b) => ROLES.indexOf(a.role) - ROLES.indexOf(b.role) || String(a.name).localeCompare(String(b.name)));
}
// Is a shift that started on its own date on duty at hour h (0..47) of that date?
const covers = (code, h) => { const s = SHIFTS[code]; return !!(s && s.duty && h >= s.start && h < s.start + s.len); };

function workedHours(code) { const s = SHIFTS[code]; return s && (s.duty || s.worked) ? (s.paid ?? s.len) : 0; }

function coverageFor(date) {
  const out = {};
  COV_GROUPS.forEach(r => out[r] = { day: 0, night: 0 });
  state.staff.forEach(s => {
    if (!out[s.role]) return;
    const c = codeAt(s.id, date);
    if (covers(c, 12)) out[s.role].day++;
    if (covers(c, 23)) out[s.role].night++;
    if (SHIFTS[c]?.charge) { if (covers(c, 12)) out.Charge.day++; if (covers(c, 23)) out.Charge.night++; }
  });
  return out;
}
function hourly(date, roles) {
  const prev = addDays(date, -1);
  const arr = Array(24).fill(0);
  state.staff.forEach(s => {
    if (!roles.includes(s.role)) return;
    const today = codeAt(s.id, date), yday = codeAt(s.id, prev);
    // Count who is on duty at the half hour, so 30-minute handover overlaps don't double count.
    for (let h = 0; h < 24; h++) if (covers(today, h + 0.5) || covers(yday, h + 24.5)) arr[h]++;
  });

}
const isDayHour = h => h >= 6 && h < 18;

function credStatus(staff, cred, onDate) {
  const exp = staff.creds && staff.creds[cred];
  if (!exp) return 'missing';
  if (exp < onDate) return 'exp';
  if (diffDays(onDate, exp) <= 45) return 'soon';
  return 'ok';
}

function computeIssues() {
  const days = scopeDays();
  const byCell = {}, list = [];
  const listed = new Set();
  // onceKey: flag every cell, but list the problem only on its first shift.
  const add = (staff, date, sev, msg, onceKey) => {
    const k = staff.id + '|' + date;
    (byCell[k] = byCell[k] || []).push({ sev, msg });
    if (onceKey && listed.has(staff.id + onceKey)) return;
    if (onceKey) listed.add(staff.id + onceKey);
    list.push({ staff, date, sev, msg: onceKey ? msg + ' Flagged on every shift after this one.' : msg });
  };
  state.staff.forEach(s => {
    let run = 0;
    days.forEach((d, i) => {
      const c = codeAt(s.id, d);
      const prev = codeAt(s.id, addDays(d, -1));
      // Hours off between the previous shift's end and this one's start; a night ending 0615 followed by any shift that day is under 10h.
      if (prev && SHIFTS[prev] && SHIFTS[prev].duty && c && SHIFTS[c] && SHIFTS[c].duty) {
        const endPrev = SHIFTS[prev].start + SHIFTS[prev].len;  // hours from start of prev date
        const gap = 24 + SHIFTS[c].start - endPrev;
        if (gap < 10) add(s, d, 'crit', `Only ${hrsText(Math.max(0, gap))}h rest after the ${SHIFTS[prev].show || prev} shift on ${short(addDays(d, -1))} (minimum 10h).`);
      }
      if (c && SHIFTS[c] && SHIFTS[c].duty && SHIFTS[c].len >= 12) { run++; if (run === 4) add(s, d, 'warn', 'Fourth 12-hour shift in a row.'); }
      else run = 0;
      if (c && SHIFTS[c] && SHIFTS[c].duty) {
        (REQUIRED_CREDS[s.role] || []).forEach(cr => {
          if (credStatus(s, cr, d) === 'exp') add(s, d, 'crit', `${cr} expired ${short(s.creds[cr])}.`, cr);
          else if (credStatus(s, cr, d) === 'missing' && i === days.findIndex(x => SHIFTS[codeAt(s.id, x)]?.duty)) add(s, d, 'warn', `No ${cr} on file.`);
        });
      }
      if (c && !SHIFTS[c]?.charge && !shiftOk(c, s.role)) add(s, d, 'crit', `${SHIFTS[c].label} is only for ${SHIFTS[c].roles.join(' and ')}; ${s.name} is ${s.role}.`);
      if (c && SHIFTS[c]?.charge) {
        if (s.role !== 'RN') add(s, d, 'crit', `Charge shifts are worked by an RN; ${s.name} is ${s.role}.`);
        CHARGE_CREDS.forEach(cr => {
          const st = credStatus(s, cr, d);
          if (st === 'exp' || st === 'missing') add(s, d, 'warn', `Charge shift without a current ${cr}${st === 'exp' ? ` (expired ${short(s.creds[cr])})` : ''}.`, 'charge' + cr);
        });
      }
    });
    payPeriodsIn(days).forEach(pd => {
      // Flag the pay period on the day the running total first passes 80h.
      let hrs = 0, firstOver = null;
      pd.forEach(d => { hrs += workedHours(codeAt(s.id, d)); if (hrs > PAY_HOURS && !firstOver) firstOver = d; });
      if (firstOver) add(s, firstOver, hrs > PAY_HOURS + 16 ? 'crit' : 'warn', `${hrsText(hrs)}h in the pay period ${short(pd[0])}–${short(pd[pd.length - 1])} (${hrsText(hrs - PAY_HOURS)}h overtime).`);
    });
  });
  list.sort((a, b) => (a.sev === b.sev ? 0 : a.sev === 'crit' ? -1 : 1) || a.date.localeCompare(b.date));
  return { byCell, list };
}

function openShifts() {
  const t = cfg().targets || {};
  const out = [];
  visDays().forEach(d => {
    if (d < todayStr) return;
    const cov = coverageFor(d);
    // Only roles that can work Day/Night (or Charge) get open shifts.
    COV_GROUPS.filter(r => bandCode(r, 'day')).forEach(r => ['day', 'night'].forEach(b => {
      const need = (t[r] && t[r][b]) || 0;
      const have = cov[r][b];
      if (have < need && bandCode(r, b)) out.push({ date: d, role: r, band: b, need: need - have, have, target: need });
    }));
  });
  return out;
}

// ---------- Rendering ----------
const main = document.getElementById('main');
let issuesCache = { byCell: {}, list: [] };

function render() {
  // Everyone but managers sees only the Schedule tab. Remember where a manager was headed until access is known.
  if (!state.canManage && state.view !== 'schedule') { state.lockedView = state.view; state.view = 'schedule'; }
  else if (state.canManage && state.lockedView) { state.view = state.lockedView; state.lockedView = null; }
  // Reports read further back than the visible dates, so they ask for those schedule periods too.
  const ep = state.view === 'reports' ? reportPeriods() : [];

  const crit = issuesCache.list.filter(i => i.sev === 'crit').length;

  updateBell();

  const banner = !state.live && state.loaded
    ? `<div class="banner warn">The shared schedule isn't available in this view, so edits stay on this screen only. Open the page on claude.ai while signed in to load and save the team's schedule.</div>` : '';
  const scroll = main.querySelector('.grid-wrap');
  const sx = scroll ? scroll.scrollLeft : null, sy = scroll ? scroll.scrollTop : null;
  const fn = { schedule: viewSchedule, coverage: viewCoverage, requests: viewRequests, rules: viewRules, staff: viewStaff, reports: viewReports }[state.view] || viewSchedule;
  main.innerHTML = banner + notesBar() + (state.view === 'schedule' ? periodBar() : '') + fn();
  const ns = main.querySelector('.grid-wrap');
  if (ns && sx != null) { ns.scrollLeft = sx; ns.scrollTop = sy; }
  else if (ns && state.view === 'schedule' && !render.scrolled) {
    render.scrolled = true;

    const el = main.querySelector(`.cell[data-s="${CSS.escape(state.sel.staffId)}"][data-d="${state.sel.date}"]`);
    if (el) el.classList.add('sel');

    return `<div class="banner stagebar noprint">${ps.map(p => {

      return `<label class="inline" for="st-${p}">Schedule ${range(p)} <select id="st-${p}" data-period="${p}">${stages.map(([v, l]) => `<option value="${v}" ${v === st ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`

function notesBar() {

  const list = state.notes.filter(n => (!n.until || n.until >= todayStr) && !hidden.includes(n.id)).sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!list.length) return '';
  return `<div class="notes">${list.map(n => `<div class="note-card"><div class="grow">${esc(n.text)}<small>Announcement · ${short(String(n.at).slice(0, 10))}${n.until ? ` · until ${short(n.until)}` : ''}</small></div>${state.canManage ? `<button class="btn small" data-act="delNote" data-id="${esc(n.id)}">Delete</button>` : `<button class="btn small" data-act="hideNote" data-id="${esc(n.id)}">Hide</button>`}</div>`).join('')}</div>`;
}
function setPeriodState(p, st) {
  if (!state.canManage) return;
  const doc = { ...(state.periods[p] || {}), state: st };
  if (st === 'posted') doc.postedAt = new Date().toISOString();
  if (st === 'open') doc.openedAt = new Date().toISOString();
  state.periods = { ...state.periods, [p]: doc }; render();
  saveDoc('periods/' + p, doc, false);
  toast(st === 'posted' ? 'Schedule posted. Staff can see it, and changes from now on are marked.' : st === 'open' ? 'Self-scheduling is open. Staff pick shifts in My schedule.' : 'Schedule is a draft. Only managers can see it.');
}
function setPeriodUntil(p, until) {
  if (!state.canManage) return;
  const doc = { ...(state.periods[p] || {}), until };
  state.periods = { ...state.periods, [p]: doc }; render();
  saveDoc('periods/' + p, doc, false);
}

function viewSchedule() {
  const days = visDays();
  const t = cfg().targets || {};
  const roleOpts = ['all', ...ROLES].map(r => `<option value="${r}" ${state.roleFilter === r ? 'selected' : ''}>${r === 'all' ? 'All roles' : r}</option>`).join('');
  // One legend entry for overtime, which uses each role's Day times.
  const legend = CODES.filter(c => !['OTP', 'OTM', 'OTS'].includes(c)).map(c => `<span>${chip(c)} ${esc(c === 'OT' ? "Overtime (role's Day times)" : SHIFTS[c].label)}</span>`).join('');
  if (state.schedMode === 'mine') return viewMySchedule();
  if (state.range === 'day') return viewDay(roleOpts);
  const tools = `<div class="row-gap noprint">${state.canManage ? '<button class="btn" data-act="pattern">Apply pattern</button><button class="btn" data-act="announce">Announce</button>' : ''}<button class="btn" data-act="exportSched">Export CSV</button><button class="btn" data-act="print">Print</button></div>`;
  const markKey = `<div class="marks"><span><i class="mk" style="background:var(--accent)"></i>Waiting on a teammate</span><span><i class="mk" style="background:var(--warn)"></i>Waiting on a manager</span><span><i class="mk tri"></i>Changed after posting</span><span><i class="mk" style="background:var(--crit);border-radius:1px;height:3px"></i>Holiday</span></div>`;
  const head = `<div class="panel-head">${schedSwitch()}<h2>Unit schedule</h2>
    <label class="inline" for="roleFilter">Show <select id="roleFilter">${roleOpts}</select></label>
    <span class="spacer"></span>${tools}
  </div><div class="panel-body" style="padding-block:8px"><div class="legend">${legend}</div>${markKey}
    ${state.canManage ? `<p class="hint noprint" style="margin-top:6px">Click a cell or use arrow keys, then type <span class="kbd">D</span> <span class="kbd">N</span> <span class="kbd">C</span> <span class="kbd">H</span> <span class="kbd">M</span> <span class="kbd">8</span> <span class="kbd">L</span> <span class="kbd">U</span> <span class="kbd">A</span> <span class="kbd">P</span> <span class="kbd">O</span> <span class="kbd">X</span>, <span class="kbd">V</span> overtime (Doctors and PAs also <span class="kbd">T</span> <span class="kbd">F</span>), <span class="kbd">Del</span> clears</p>` : '<p class="hint noprint" style="margin-top:6px">View only · send requests from My schedule</p>'}</div>`;
  if (!state.staff.length) return `<section class="panel">${head}${emptyStaff()}</section>`;

  // Pay periods are numbered from the first one, starting Nov 1, 2026; earlier ones show dates only.
  const wk = `<tr class="weeks"><th class="name"></th>${payPeriodsIn(days).map(pd => { const n = pd.filter(d => days.includes(d)).length; return `<th colspan="${n}" class="ppstart">${n >= 7 ? `Pay period${payNo(pd[0])} · ` : ''}${short(pd[0])}–${short(pd[PAY_DAYS - 1])}${n >= 7 ? ` · ${PAY_HOURS}h` : ''}</th>`; }).join('')}<th class="tot"></th></tr>`;
  const dh = `<tr class="days"><th class="name"><span class="eyebrow">Staff</span></th>${days.map((d, i) => {
    const w = dow(d), hol = holidayOf(d); const cls = [(w === 0 || w === 6) ? 'wkend' : '', colCls(d, i), d === todayStr ? 'today' : '', hol ? 'hol' : ''].join(' ');
    return `<th class="${cls}"${hol ? ` title="${esc(hol)}"` : ''}><span class="dow">${DOW[w][0]}</span><span class="dn">${parse(d).getUTCDate()}</span></th>`;
  }).join('')}<th class="tot"><span class="eyebrow">Hrs</span></th></tr>`;

  const marks = requestMarks(), changed = changedSincePost();
  let body = '';
  ROLES.forEach(role => {
    if (state.roleFilter !== 'all' && state.roleFilter !== role) return;
    const people = sortedStaff().filter(s => s.role === role);
    if (!people.length) return;
    body += `<tr class="group"><th>${esc(role)} <span class="sub" style="font-weight:400;color:var(--muted)">· ${people.length}</span></th><td colspan="${days.length + 1}"></td></tr>`;
    people.forEach(s => {
      let total = 0;
      const target = Math.round((s.fte || 0) * PAY_HOURS * days.length / PAY_DAYS);
      const cells = days.map((d, i) => {
        const c = codeAt(s.id, d); total += workedHours(c);
        const iss = issuesCache.byCell[s.id + '|' + d];
        const flag = iss ? `<span class="flag ${iss.some(x => x.sev === 'crit') ? '' : 'warn'}"></span>` : '';
        const w = dow(d);
        const cls = [(w === 0 || w === 6) ? 'wkend' : '', colCls(d, i)].join(' ');
        const k = s.id + '|' + d;
        const pend = (marks[k] ? ' ' + marks[k] : '') + (changed.has(k) ? ' changed' : '');
        return `<td class="${cls}"><button class="cell${pend}" data-s="${esc(s.id)}" data-d="${d}" aria-label="${esc(s.name)}, ${nice(d)}: ${c ? esc(SHIFTS[c]?.label || c) : 'off'}">${chip(c)}${flag}</button></td>`;
      }).join('');
      const over = total > target + 12;
      body += `<tr><th class="name${s.id === state.me ? ' me' : ''}"><span class="nm">${esc(s.name)}</span><span class="meta">${esc(s.role)} · ${(+s.fte || 0).toFixed(1)} FTE${s.sample ? ' · sample' : ''}</span></th>${cells}<td class="tot num ${over ? 'ot' : ''}" title="Target about ${target}h for these ${days.length} days">${hrsText(total)}</td></tr>`;
    });
  });

  const covRows = [];
  const covs = days.map(coverageFor);
  COV_GROUPS.forEach(role => {
    if (!inFilter(role)) return;
    ['day', 'night'].forEach(b => {
      const tgt = (t[role] && t[role][b]) || 0;
      if (!tgt && !covs.some(c => c[role][b])) return;
      covRows.push(`<tr><th class="name">${esc(role)} · ${b === 'day' ? 'Day (at 1200)' : 'Night (at 2300)'}</th>${covs.map((c, i) => {
        const have = c[role][b]; const cls = have < tgt ? 'short' : have > tgt ? 'over' : 'met';
        return `<td class="${colCls(days[i], i)}"><span class="cov ${cls}" title="${have} scheduled, target ${tgt}">${have}/${tgt}</span></td>`;
      }).join('')}<td class="tot"></td></tr>`);
    });
  });
  const foot = covRows.join('');

  return `<section class="panel">${head}<div class="grid-wrap" id="gridWrap"><table class="grid" id="grid"><thead>${wk}${dh}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div></section>`;
}

function viewDay(roleOpts) {
  const d = visDays()[0];
  const t = cfg().targets || {};
  const head = `<div class="panel-head">${schedSwitch()}<h2>Daily roster</h2><span class="sub">${esc(nice(d))}${d === todayStr ? ' · today' : ''}</span>
    <label class="inline" for="roleFilter">Show <select id="roleFilter">${roleOpts}</select></label><span class="spacer"></span>
    <span class="sub">${state.canManage ? 'Click a name to change their shift' : 'View only'}</span></div>`;
  if (!state.staff.length) return `<section class="panel">${head}${emptyStaff()}</section>`;
  const people = sortedStaff().filter(s => state.roleFilter === 'all' || s.role === state.roleFilter);
  const marks = requestMarks();
  const person = s => {
    const iss = issuesCache.byCell[s.id + '|' + d];
    const flag = iss ? `<span class="flag ${iss.some(x => x.sev === 'crit') ? '' : 'warn'}" title="${esc(iss.map(x => x.msg).join(' '))}"></span>` : '';
    const c = codeAt(s.id, d);
    return `<button class="cell dayp${marks[s.id + '|' + d] ? ' ' + marks[s.id + '|' + d] : ''}${s.id === state.me ? ' me' : ''}" data-s="${esc(s.id)}" data-d="${d}" aria-label="${esc(s.name)}, ${esc(s.role)}: ${c ? esc(SHIFTS[c]?.label || c) : 'off'}"><span>${esc(s.name)}</span><span class="meta">${esc(s.role)}</span>${flag}</button>`;
  };
  const cols = CODES.map(code => {
    const on = people.filter(s => codeAt(s.id, d) === code);
    if (!on.length) return '';
    return `<div class="daycol"><h3>${chip(code)} ${esc(SHIFTS[code].label)}<span class="sub">${on.length}</span></h3>${on.map(person).join('')}</div>`;
  }).join('');
  const off = people.filter(s => !codeAt(s.id, d));
  const cov = coverageFor(d);
  const covRows = COV_GROUPS.filter(r => inFilter(r) && ((t[r]?.day || 0) + (t[r]?.night || 0) + cov[r].day + cov[r].night > 0)).map(r => {
    const cell = b => { const have = cov[r][b], tgt = t[r]?.[b] || 0; return `<td><span class="cov ${have < tgt ? 'short' : have > tgt ? 'over' : 'met'}" title="${have} scheduled, target ${tgt}">${have}/${tgt}</span></td>`; };
    return `<tr><td>${esc(r)}</td>${cell('day')}${cell('night')}</tr>`;
  }).join('');
  const onDuty = people.filter(s => SHIFTS[codeAt(s.id, d)]?.duty).length;
  return `<section class="panel">${head}
    ${cols ? `<div class="daycols">${cols}</div>` : `<div class="empty"><strong>Nobody is scheduled on ${esc(nice(d))}</strong>${state.canManage ? 'Pick a name under Not scheduled to add a shift.' : ''}</div>`}
    ${off.length ? `<details class="offlist"${cols ? '' : ' open'}><summary>Not scheduled · ${off.length}</summary><div class="daycols"><div class="daycol">${off.map(person).join('')}</div></div></details>` : ''}
  </section>
  <section class="panel"><div class="panel-head"><h2>Coverage</h2><span class="sub">${onDuty} on duty · day counted at 1200, night at 2300</span></div>
    <div class="tbl-wrap"><table class="daycov"><thead><tr><th>Role</th><th>Day</th><th>Night</th></tr></thead><tbody>${covRows || '<tr><td colspan="3" class="det">No targets set.</td></tr>'}</tbody></table></div></section>`;
}

function inFilter(group) { return state.roleFilter === 'all' || state.roleFilter === group || (group === 'Charge' && state.roleFilter === 'RN'); }
function colCls(d, i) { return i === 0 || isPayStart(d) ? 'ppstart' : dow(d) === 0 ? 'wkstart' : ''; }
// Pay periods are numbered from the first one, starting Nov 1, 2026; earlier ones show dates only.
function payNo(d) { const n = Math.floor(diffDays(ANCHOR, d) / PAY_DAYS) + 1; return n > 0 ? ' ' + n : ''; }

function schedSwitch() {
  return `<div class="seg" role="group" aria-label="Schedule view">${[['unit', 'Unit'], ['mine', 'My schedule']].map(([m, l]) => `<button type="button" data-act="schedMode" data-mode="${m}" aria-pressed="${state.schedMode === m}">${l}</button>`).join('')}</div>`;
}

function viewMySchedule() {
  const pps = payPeriodsIn(visDays());
  const days = pps.flat();
  const me = staffById(state.me);
  const pick = `<label class="inline" for="mySel">${me ? 'Showing' : 'Whose schedule?'} <select id="mySel"><option value="">Choose a name</option>${sortedStaff().map(s => `<option value="${esc(s.id)}" ${s.id === state.me ? 'selected' : ''}>${esc(s.name)} · ${esc(s.role)}</option>`).join('')}</select></label>`;
  const head = `<div class="panel-head">${schedSwitch()}<h2>${me ? esc(me.name) : 'My schedule'}</h2>${me ? `<span class="sub">${esc(me.role)} · ${(+me.fte || 0).toFixed(1)} FTE</span>` : ''}<span class="spacer"></span>${pick}</div>`;
  if (!state.staff.length) return `<section class="panel">${head}${emptyStaff()}</section>`;
  if (!me) return `<section class="panel">${head}<div class="empty"><strong>Pick your name to see your schedule</strong>Your shifts, hours per pay period and requests show here. Choosing a name also sets <b>Acting as</b>, so you can send requests.</div></section>`;

  const iss = issuesCache.list.filter(i => i.staff.id === me.id);
  const marks = requestMarks(), changed = changedSincePost();
  const isWork = c => SHIFTS[c] && (SHIFTS[c].duty || SHIFTS[c].worked);
  const upcoming = days.filter(d => d >= todayStr && isWork(codeAt(me.id, d)));
  const next = upcoming[0];
  const totalShifts = days.filter(d => SHIFTS[codeAt(me.id, d)]?.duty).length;
  const fteTarget = (me.fte || 0) * PAY_HOURS;

  // Calendar: one band per pay period, Sun–Sat rows.
  let cal = DOW.map(d => `<div class="dh">${d}</div>`).join('');
  pps.forEach(pd => {
    const hrs = pd.reduce((t, d) => t + workedHours(codeAt(me.id, d)), 0);
    cal += `<div class="pp"><span>Pay period${payNo(pd[0])} · ${short(pd[0])}–${short(pd[13])}</span><span><b class="${hrs > PAY_HOURS ? 'ot' : ''}">${hrsText(hrs)}h</b> of ${PAY_HOURS}h${fteTarget && fteTarget !== PAY_HOURS ? ` · FTE target ${hrsText(fteTarget)}h` : ''}${hrs > PAY_HOURS ? ` · <span class="ot">${hrsText(hrs - PAY_HOURS)}h overtime</span>` : ''}</span></div>`;
    cal += pd.map(d => {
      const c = codeAt(me.id, d), sh = SHIFTS[c];
      const w = dow(d), dt = parse(d);
      const cls = ['cell', 'calday', d < todayStr ? 'past' : '', d === todayStr ? 'today' : '', (w === 0 || w === 6) ? 'wkend' : '', marks[me.id + '|' + d] || '', changed.has(me.id + '|' + d) ? 'changed' : ''].join(' ');
      const num = dt.getUTCDate() === 1 || d === days[0] ? `${MON[dt.getUTCMonth()]} ${dt.getUTCDate()}` : dt.getUTCDate();
      const [name, time] = sh ? (/ \d{4}–\d{4}$/.test(sh.label) ? [sh.label.replace(/ \d{4}–\d{4}$/, ''), sh.label.match(/\d{4}–\d{4}$/)[0]] : [sh.label, '']) : ['', ''];
      const cellIss = issuesCache.byCell[me.id + '|' + d];
      const flag = cellIss ? `<span class="flag ${cellIss.some(x => x.sev === 'crit') ? '' : 'warn'}"></span>` : '';
      return `<button class="${cls}" data-s="${esc(me.id)}" data-d="${d}" aria-label="${nice(d)}: ${sh ? esc(sh.label) : 'off'}"><span class="dnum">${num}</span>${holidayOf(d) ? `<span class="hol">${esc(holidayOf(d))}</span>` : ''}${sh ? `<span class="shift ${sh.cls}">${esc(name)}${time ? `<small>${time}</small>` : ''}</span>` : ''}${flag}</button>`;
    }).join('');
  });

  const myReqs = state.requests.filter(r => r.staffId === me.id || r.withId === me.id || r.claimedBy === me.id).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const reqList = myReqs.length ? myReqs.map(r => myReqItem(r, me)).join('')
    : `<li class="det">No requests yet. Use the form below to ask for time off, or to swap or give away a shift.</li>`;
  const sentDates = new Set(state.requests.filter(r => r.status === 'pending' && r.staffId === me.id).map(r => r.date));
  const opens = openShiftsFor(me);
  const gives = claimable(me);
  const giveList = gives.map(r => `<li><span class="pill offered">up for grabs</span><div class="grow"><div class="ttl">${esc(SHIFTS[r.code]?.label || r.code)}</div><div class="det">${nice(r.date)} · from ${esc(staffById(r.staffId)?.name || 'a teammate')}${r.note ? ` “${esc(r.note)}”` : ''}</div></div><button class="btn small primary" data-act="claim" data-id="${esc(r.id)}">Claim</button></li>`).join('');
  const openList = opens.length ? opens.slice(0, 20).map(o => `<li><span class="pill short">${o.need} open</span><div class="grow"><div class="ttl">${esc(SHIFTS[o.code].label)}</div><div class="det">${nice(o.date)} · ${o.have} of ${o.target} scheduled</div></div>${sentDates.has(o.date) ? '<span class="det">Request sent</span>' : `<button class="btn small primary" data-act="pickup" data-d="${o.date}" data-c="${o.code}">Request this shift</button>`}</li>`).join('') + (opens.length > 20 ? `<li class="det">${opens.length - 20} more later on.</li>` : '')
    : `<li class="det">No open ${esc(me.role)} shifts on your days off right now.</li>`;
  const issList = iss.length ? iss.map(i => `<li><span class="sev ${i.sev === 'crit' ? '' : 'warn'}"></span><div class="grow"><div class="ttl">${nice(i.date)}</div><div class="det">${esc(i.msg)}</div></div></li>`).join('') : '';

  return `<section class="panel">${head}
    <div class="stats">
      <div class="stat"><b>${next ? esc(nice(next)) : '—'}</b><span>${next ? `next shift · ${esc(SHIFTS[codeAt(me.id, next)].label)}` : 'no more shifts this period'}</span></div>
      <div class="stat"><b class="num">${totalShifts}</b><span>shifts in ${pps.length === 1 ? 'this pay period' : pps.length + ' pay periods'}</span></div>
      <div class="stat"><b class="num">${hrsText(days.reduce((t, d) => t + workedHours(codeAt(me.id, d)), 0))}h</b><span>paid hours of ${hrsText((me.fte || 0) * PAY_HOURS * pps.length)}h target</span></div>
      <div class="stat"><b class="num ${iss.length ? 'bad' : ''}">${iss.length}</b><span>rule ${iss.length === 1 ? 'problem' : 'problems'}</span></div>
    </div>
    <div class="cal">${cal}</div></section>
    <div class="two">
      <section class="panel"><div class="panel-head"><h2>My requests</h2><span class="sub">A manager approves requests</span></div><ul class="list">${reqList}</ul>${requestForm(me)}</section>
      <section class="panel"><div class="panel-head"><h2>Open shifts</h2><span class="sub">Shifts you could pick up</span></div><ul class="list">${giveList}${opens.length || !gives.length ? openList : ''}</ul></section>
      ${iss.length ? `<section class="panel"><div class="panel-head"><h2>Rule problems</h2><span class="sub">A manager can fix these on the Unit view</span></div><ul class="list issues-list">${issList}</ul></section>` : ''}
    </div>`;
}

function viewCoverage() {
  const days = visDays();
  if (!state.covDate || !days.includes(state.covDate)) state.covDate = days.includes(todayStr) ? todayStr : days[0];
  const d = state.covDate;
  const t = cfg().targets || {};
  const rnRoles = ['RN'];
  const nurses = hourly(d, rnRoles);
  const techs = hourly(d, ['Medic']);
  const tgtN = h => (isDayHour(h) ? t['RN']?.day || 0 : t['RN']?.night || 0);
  const arrivals = cfg().arrivals || DEFAULT_CONFIG.arrivals;
  const shortHours = nurses.filter((v, h) => v < tgtN(h)).length;
  const peakRatio = Math.max(...arrivals.map((a, h) => nurses[h] ? a / nurses[h] : a));
  const totalArr = arrivals.reduce((a, b) => a + b, 0);

  // Chart geometry
  const W = 720, H = 240, L = 34, R = 10, T = 64, B = 24;
  const cw = (W - L - R) / 24;
  const maxY = Math.max(4, ...nurses.map((v, h) => Math.max(v + techs[h], tgtN(h)))) + 1;
  const y = v => T + (H - T - B) * (1 - v / maxY);
  const maxA = Math.max(...arrivals, 1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Staff on duty by hour for ${nice(d)} compared with target">`;
  for (let v = 0; v <= maxY; v += maxY > 12 ? 4 : 2) svg += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  // arrivals strip on top
  svg += `<text x="${L}" y="11" style="font-family:var(--f-body);font-size:11px">Patient arrivals per hour (historical average)</text>`;
  arrivals.forEach((a, h) => {
    const bh = 34 * a / maxA;
    svg += `<rect x="${L + h * cw + 3}" y="${52 - bh}" width="${cw - 6}" height="${bh}" fill="var(--muted)" opacity=".35" rx="2"><title>${String(h).padStart(2, '0')}00: ${a} arrivals</title></rect>`;
  });
  nurses.forEach((v, h) => {
    const x = L + h * cw + 3, w = cw - 6;
    const short = v < tgtN(h);
    svg += `<rect x="${x}" y="${y(v)}" width="${w}" height="${y(0) - y(v)}" fill="${short ? 'var(--crit)' : 'var(--accent)'}" rx="2"><title>${String(h).padStart(2, '0')}00: ${v} nurses, target ${tgtN(h)}</title></rect>`;
    if (techs[h]) svg += `<rect x="${x}" y="${y(v + techs[h])}" width="${w}" height="${y(v) - y(v + techs[h])}" fill="var(--accent)" opacity=".35" rx="2"><title>${techs[h]} medics</title></rect>`;
  });
  let path = '';
  for (let h = 0; h < 24; h++) { const yy = y(tgtN(h)); path += `${h ? 'L' : 'M'}${L + h * cw},${yy} L${L + (h + 1) * cw},${yy} `; }
  svg += `<path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 3"/>`;
  for (let h = 0; h < 24; h += 3) svg += `<text x="${L + h * cw + cw / 2}" y="${H - 8}" text-anchor="middle">${String(h).padStart(2, '0')}00</text>`;
  svg += `</svg>`;

  // Gantt of who is on duty
  const prev = addDays(d, -1);
  const rows = [];
  sortedStaff().forEach(s => {
    const segs = [];
    const yc = codeAt(s.id, prev); if (SHIFTS[yc]?.duty && SHIFTS[yc].start + SHIFTS[yc].len > 24) segs.push({ code: yc, a: 0, b: SHIFTS[yc].start + SHIFTS[yc].len - 24 });
    const tc = codeAt(s.id, d); if (SHIFTS[tc]?.duty) segs.push({ code: tc, a: SHIFTS[tc].start, b: Math.min(24, SHIFTS[tc].start + SHIFTS[tc].len) });
    if (segs.length) rows.push({ s, segs });
  });

// Open shifts this person could pick up: their role (charge for RNs), from today, on days they are off.
function openShiftsFor(me) {

  }).filter(o => o.forRole === me.role && !codeAt(me.id, o.date));
}

// Self-scheduling: staff pick their own working shifts in an open schedule, up to each shift's target and their FTE hours.
function selfSchedFor(staffId, date) {
  if (state.canManage || !staffId || staffId !== state.me || date < todayStr) return false;
  const p = state.periods[periodOf(date)];
  return !!p && p.state === 'open' && (!p.until || todayStr <= p.until);
}
const selfCodes = role => CODES.filter(c => SHIFTS[c].duty && shiftOk(c, role) && !SHIFTS[c].charge && !c.startsWith('OT'));
function selfBlock(s, date, code) {
  const t = cfg().targets || {}, cov = coverageFor(date), cur = codeAt(s.id, date);
  for (const [band, h] of [['day', 12], ['night', 23]]) {
    const tgt = (t[s.role] && t[s.role][band]) || 0;
    if (tgt && covers(code, h) && !covers(cur, h) && cov[s.role][band] >= tgt) return 'Full';
  }
  const pd = span(payStartOf(date), addDays(payStartOf(date), PAY_DAYS - 1));
  const hrs = pd.reduce((n, d) => n + workedHours(d === date ? code : codeAt(s.id, d)), 0);
  if (hrs > (s.fte || 1) * PAY_HOURS) return 'Past your FTE';
  return '';
}
// Shifts teammates are giving away that this person could take: same role, from today, on a day they are off.
function claimable(me) {
  return state.requests.filter(r => r.type === 'giveaway' && r.status === 'offered' && r.staffId !== me.id && r.date >= todayStr
    && staffById(r.staffId)?.role === me.role && !codeAt(me.id, r.date));
}
// Cell marks for open requests: blue while waiting on a teammate, amber while waiting on a manager.
function requestMarks() {
  const m = {};
  state.requests.forEach(r => {
    if (r.status !== 'pending' && r.status !== 'offered') return;
    const days = r.type === 'timeoff' ? span(r.date, r.until && r.until > r.date ? r.until : r.date).slice(0, 31) : [r.date];
    [r.staffId, r.withId, r.claimedBy].filter(Boolean).forEach(id => days.forEach(d => { if (m[id + '|' + d] !== 'pending') m[id + '|' + d] = r.status; }));
  });
  return m;
}
const statusText = r => r.status === 'offered' ? (r.type === 'swap' ? 'awaiting teammate' : 'up for grabs') : r.status;

function bulkBar() {

  </div>`;
}
async function bulkRemove() {
  const ids = [...state.staffSel];
  const names = new Map(ids.map(id => [id, staffById(id)?.name]));
  state.bulkBusy = true; state.bulkArm = false; render();
  let i = 0, failed = 0;
  const worker = async () => {
    while (i < ids.length) {
      const id = ids[i++];
      try { if (state.db) await queued('staff/' + id, () => state.db.doc('staff/' + id).delete()); } catch (err) { failed++; continue; }
      state.staff = state.staff.filter(x => x.id !== id); state.staffSel.delete(id);
    }
  };
  await Promise.all(Array.from({ length: 4 }, worker));
  state.bulkBusy = false; render();
  const done = ids.length - failed;
  toast(failed ? `Removed ${done}; ${failed} could not be removed. Try again.` : `${done === 1 ? names.get(ids[0]) : done + ' people'} removed. Past shifts stay in the schedule history.`);
}

// ---------- Reports ----------
const REPORTS = [['hours', 'Hours & leave'], ['calloffs', 'Call-offs'], ['fair', 'Holidays & weekends'], ['history', 'Change history']];
const rptPP = () => state.rptPP || payStartOf(todayStr);
// Holidays and weekends look back the chosen months and ahead through the next schedule.
const fairWindow = () => [addMonths(todayStr, -state.rptMonths), addDays(periodOf(todayStr), PERIOD_DAYS * 2 - 1)];
function reportPeriods() {
  const [a, b] = state.rptTab === 'hours' ? [rptPP(), addDays(rptPP(), PAY_DAYS - 1)] : state.rptTab === 'fair' ? fairWindow() : [null, null];
  const out = [];
  if (a) for (let p = periodOf(a); p <= b; p = addDays(p, PERIOD_DAYS)) out.push(p);
  return out;
}
const loadedAll = ps => !state.db || ps.every(p => state.rowsBy[p]);

const monthsSel = () => `<label class="inline" for="rptMonths">Look back <select id="rptMonths">${[3, 6, 12].map(m => `<option value="${m}" ${m === state.rptMonths ? 'selected' : ''}>${m} months</option>`).join('')}</select></label>`;
const dash = v => v ? hrsText(v) : '<span style="color:var(--muted)">–</span>';

function viewReports() {
  if (!REPORTS.some(([k]) => k === state.rptTab)) state.rptTab = 'hours';
  const r = { hours: rptHours, calloffs: rptCalloffs, fair: rptFair, history: rptHistory }[state.rptTab]();
  return `<section class="panel"><div class="panel-head"><h2>Reports</h2><div class="seg noprint" role="group" aria-label="Report">${REPORTS.map(([k, l]) => `<button type="button" data-act="rptTab" data-tab="${k}" aria-pressed="${state.rptTab === k}">${l}</button>`).join('')}</div><span class="spacer"></span><div class="row-gap noprint">${r.tools}</div></div>${r.body}</section>`;
}
function hoursRows(p) {
  const days = span(p, addDays(p, PAY_DAYS - 1));
  return [...state.staff].sort(STAFF_SORTS.role[1]).map(s => {
    const h = { worked: 0, ot: 0, edu: 0, adm: 0, leave: 0, co: 0 };
    days.forEach(d => {
      const c = codeAt(s.id, d), sh = SHIFTS[c]; if (!sh) return;
      if (sh.duty) h[c.startsWith('OT') ? 'ot' : 'worked'] += workedHours(c);
      else if (c === 'EDU') h.edu += workedHours(c);
      else if (c === 'ADM') h.adm += workedHours(c);
      else if (c === 'PTO') h.leave += sh.len;
      else if (c === 'CO') h.co++;
    });
    const total = h.worked + h.ot + h.edu + h.adm, target = Math.round((s.fte || 0) * PAY_HOURS);
    return { s, ...h, total, target, diff: total - target, over: Math.max(0, total - PAY_HOURS) };
  });
}

function rptFair() {

  const stats = sortedStaff().map(s => {

  });
  const roles = ROLES.filter(r => bandCode(r, 'day') && state.staff.some(s => s.role === r));
  const upcoming = hols.filter(d => d >= todayStr).slice(0, 4).map(d => `<div><h3>${esc(holidayOf(d))} · ${nice(d)}</h3>${roles.map(r => {

    const next = mine.filter(x => !codeAt(x.s.id, d)).sort((a, b) => a.hw.length - b.hw.length || a.we - b.we || byName(a.s, b.s)).slice(0, 3);

  }).join('')}</div>`).join('');
  const body = `<div class="tbl-wrap"><table class="staff"><thead><tr><th>Name</th><th>Role</th><th class="right">Holidays worked</th><th>Which</th><th class="right">Weekend shifts</th><th class="right">Per pay period</th></tr></thead><tbody>${stats.map(x => `<tr><td>${esc(x.s.name)}</td><td>${esc(x.s.role)}</td><td class="num right"><b>${x.hw.length}</b></td><td style="color:var(--muted);font-size:12px">${x.hw.map(d => esc(holidayOf(d))).join(', ')}</td><td class="num right">${x.we}</td><td class="num right">${(x.we / payPeriods).toFixed(1)}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="padding:10px 14px">${short(from)} ${parse(from).getUTCFullYear()} – ${short(to)} ${parse(to).getUTCFullYear()}, including shifts already scheduled. Holidays are the 11 US federal holidays on their calendar dates.</p>

// Names of whoever made a change come from their sign-in profile; fetched once per person.

function renderPop() {
  const { staffId, date } = state.sel;
  const s = staffById(staffId); if (!s) return closePop();
  const cur = codeAt(staffId, date);
  const iss = issuesCache.byCell[staffId + '|' + date] || [];
  // Staff picking their own shifts see only the shifts open to them, with full ones greyed out.
  const self = selfSchedFor(staffId, date);
  const codes = self ? selfCodes(s.role) : CODES.filter(c => (shiftOk(c, s.role) && c !== 'CO') || c === cur);
  const opt = c => { const why = self && c !== cur ? selfBlock(s, date, c) : ''; return `<button class="opt ${c === cur ? 'cur' : ''}" data-code="${c}"${why ? ` disabled title="${esc(why)}" style="opacity:.45;cursor:not-allowed"` : ''}>${chip(c)}<span>${esc(why || SHIFTS[c].label.replace(/ \d.*$/, ''))}</span></button>`; };
  const hol = holidayOf(date);
  const canClear = !self || selfCodes(s.role).includes(cur);
  const callOff = state.canManage && SHIFTS[cur]?.duty ? `<div class="row"><button class="btn small" data-calloff="calloff">Mark call-off</button><button class="btn small" data-calloff="sick">Mark sick</button></div>` : '';
  popEl.innerHTML = `<h3>${esc(s.name)}</h3><div class="sub">${nice(date)} · ${esc(s.role)}${hol ? ' · ' + esc(hol) : ''}${self ? ' · pick your shift' : ''}</div>
    <div class="opts">${codes.map(opt).join('')}</div>
    ${iss.length ? `<ul class="issues">${iss.map(i => `<li class="${i.sev === 'crit' ? '' : 'warn'}">${esc(i.msg)}</li>`).join('')}</ul>` : ''}
    ${callOff}
    <div class="row">${canClear ? '<button class="btn small" data-code="">Clear</button>' : '<span></span>'}<button class="btn small" data-close>Close</button></div>`;
  const cell = main.querySelector(`.cell[data-s="${CSS.escape(staffId)}"][data-d="${date}"]`);
  if (!cell) { popEl.style.left = '50%'; popEl.style.top = '30%'; return; }
  const r = cell.getBoundingClientRect();
  const pw = 250, ph = popEl.offsetHeight || 220;
  let left = r.left + r.width / 2 - pw / 2; left = Math.max(8, Math.min(window.innerWidth - pw - 8, left));
  let top = r.bottom + 6; if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  popEl.style.left = left + 'px'; popEl.style.top = top + 'px';
}
function closePop() { if (popEl) { popEl.remove(); popEl = null; } }

function submitRequest(r) {
  if (!state.me) return toast('Choose your name under Acting as first.');
  const id = 'r' + Date.now().toString(36) + uid().slice(0, 4);
  const doc = { type: r.type, staffId: state.me, date: r.date, status: r.status || 'pending', createdAt: new Date().toISOString() };
  if (r.code) doc.code = r.code;
  if (r.until) doc.until = r.until;
  if (r.withId) doc.withId = r.withId;
  if (r.note) doc.note = r.note;
  state.requests = [...state.requests, { id, ...doc }];

    : r.type === 'giveaway' ? 'Shift offered to your teammates. Once someone claims it, it goes to a manager.' : 'Request sent to the charge nurse and manager.');

async function decide(id, status) {
  const r = state.requests.find(x => x.id === id); if (!r) return;
  if (status === 'approved' && r.type === 'giveaway' && (!r.claimedBy || codeAt(r.claimedBy, r.date)))
    return toast(r.claimedBy ? `${staffById(r.claimedBy)?.name || 'The teammate'} already has a shift that day.` : 'Nobody has claimed this shift yet.');
  r.status = status; render();
  saveDoc('requests/' + id, { status, decidedAt: new Date().toISOString() }, true);
  if (status !== 'approved') { toast('Request denied.'); return; }
  if (r.type === 'pickup') await setCell(r.staffId, r.date, r.code || 'D');
  if (r.type === 'timeoff') {
    const n = Math.min(30, diffDays(r.date, r.until || r.date));
    for (let i = 0; i <= n; i++) await setCell(r.staffId, addDays(r.date, i), r.code || 'PTO');
  }
  if (r.type === 'giveaway') {
    const code = codeAt(r.staffId, r.date) || r.code;
    await setCell(r.staffId, r.date, ''); await setCell(r.claimedBy, r.date, code);
  }
  if (r.type === 'swap') {
    const a = codeAt(r.staffId, r.date), b = codeAt(r.withId, r.date);
    await setCell(r.staffId, r.date, b); await setCell(r.withId, r.date, a);
  }
  toast('Approved and added to the schedule.');
}

const normKey = s => String(s || '').trim().toLowerCase().replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ');
const IMPORT_HEADERS = {
  name: ['name', 'full name', 'staff', 'staff name', 'employee', 'employee name'],
  first: ['first', 'first name', 'given name'],
  last: ['last', 'last name', 'surname', 'family name'],

  fte: ['fte'],

};
ALL_CREDS.forEach(c => { const k = c.toLowerCase(); IMPORT_HEADERS[c] = [k, k + ' exp', k + ' expiry', k + ' expires', k + ' expiration']; });
const DEFAULT_ORDER = ['name', 'role', 'fte', 'pref', ...ALL_CREDS];
const ROLE_ALIASES = {
  'charge': 'RN', 'charge nurse': 'RN', 'charge rn': 'RN', 'rn': 'RN', 'nurse': 'RN', 'registered nurse': 'RN',
  'medic': 'Medic', 'paramedic': 'Medic', 'emt': 'Medic', 'ed tech': 'Medic', 'msa': 'MSA', 'unit secretary': 'MSA',
  'admin': 'Admin', 'administrative': 'Admin', 'supply': 'Supply', 'dispatcher': 'Dispatcher', 'dispatch': 'Dispatcher',
