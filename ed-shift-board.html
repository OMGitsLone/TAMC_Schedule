  'doctor': 'Doctor', 'physician': 'Doctor', 'md': 'Doctor', 'm d': 'Doctor', 'do': 'Doctor', 'd o': 'Doctor', 'attending': 'Doctor', 'ed physician': 'Doctor'
};
const PREFS = { '': '', 'day': 'Days', 'days': 'Days', 'night': 'Nights', 'nights': 'Nights', 'mid': 'Mids', 'mids': 'Mids', 'swing': 'Mids', 'swings': 'Mids', 'rotating': 'Rotating', 'rotate': 'Rotating', 'any': '', 'none': '', 'no preference': '' };

// Handles spreadsheet pastes (tabs) and CSV files (commas or semicolons, quoted cells).
function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = first.includes('\t') ? '\t' : first.split(';').length > first.split(',').length ? ';' : ',';
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function parseDate(s) {
  let m, y, mo, d;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, mo, d] = m.map(Number);
  else if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/))) { [, mo, d, y] = m.map(Number); if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(Date.UTC(y, mo - 1, d));
  return dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d ? fmt(dt) : null;
}
function analyzeImport(text) {
  const rows = parseDelimited(text);
  if (!rows.length) return { rows: [], header: false };
  let map = {};
  rows[0].forEach((c, i) => { const k = normKey(c); for (const [f, al] of Object.entries(IMPORT_HEADERS)) if (al.includes(k) && map[f] == null) map[f] = i; });
  const header = map.name != null || map.first != null;
  if (!header) { map = {}; DEFAULT_ORDER.forEach((f, i) => map[f] = i); }
  const byName = new Map(state.staff.map(s => [String(s.name).trim().toLowerCase(), s]));
  const seen = new Set();
  return { header, rows: (header ? rows.slice(1) : rows).map((r, idx) => {
    const get = f => map[f] != null ? (r[map[f]] || '').trim() : '';
    const errors = [];
    const name = (get('name') || [get('first'), get('last')].filter(Boolean).join(' ')).replace(/\s+/g, ' ');
    if (!name) errors.push('Name is missing.');
    const rawRole = get('role');
    const role = ROLE_ALIASES[normKey(rawRole)] || ROLES.find(x => x.toLowerCase() === normKey(rawRole));
    if (!rawRole) errors.push('Role is missing.');
    else if (!role) errors.push(`“${rawRole}” is not a role. Use ${ROLES.join(', ')}.`);
    let fte = null;
    const rawFte = get('fte').replace('%', '');
    if (rawFte) {
      let v = parseFloat(rawFte); if (v > 1 && v <= 100) v /= 100;
      if (v >= 0.1 && v <= 1) fte = Math.round(v * 100) / 100; else errors.push(`FTE “${get('fte')}” must be between 0.1 and 1.0.`);
    }
    const pref = PREFS[normKey(get('pref'))];
    if (pref === undefined) errors.push(`Preference “${get('pref')}” should be Days, Nights, Mids or Rotating.`);
    const creds = {};
    ALL_CREDS.forEach(c => {
      const v = get(c); if (!v) return;
      const d = parseDate(v);
      if (d) creds[c] = d; else errors.push(`${c} date “${v}” isn't a date. Use YYYY-MM-DD or MM/DD/YYYY.`);
    });
    const key = name.toLowerCase();
    if (name && seen.has(key)) errors.push('This name is listed more than once.');
    seen.add(key);
    return { line: idx + (header ? 2 : 1), name, role, fte, pref, creds, errors, existing: byName.get(key) };
  }) };
}

        while (work.length) {
          const { id, data } = work.shift();
          try { await queued('staff/' + id, () => state.db.doc('staff/' + id).set(data)); } catch { failed++; }
          status.textContent = `Saving ${++done} of ${docs.length}…`;
        }
      };
      await Promise.all(Array.from({ length: 4 }, worker));
    }
    scrim.remove();
    toast(failed ? `Imported ${docs.length - failed} of ${docs.length}. ${failed} could not be saved; import those rows again.` : `Imported ${docs.length} ${docs.length === 1 ? 'person' : 'people'}.`);
  }

  ta.addEventListener('input', () => { clearTimeout(t); t = setTimeout(preview, 200); });
  scrim.querySelector('#iFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => { ta.value = String(reader.result || ''); scrim.querySelector('#iFileName').textContent = f.name; preview(); };
    reader.onerror = () => toast('That file could not be read. Save it as CSV and try again.');
    reader.readAsText(f);
  });
  scrim.addEventListener('click', e => {
    const i = e.target.dataset.i;
    if (i === 'cancel' && !busy) scrim.remove();
    if (i === 'example') { ta.value = example; preview(); }
    if (i === 'go') run();
  });
  scrim.addEventListener('keydown', e => { if (e.key === 'Escape' && !busy) scrim.remove(); });
}

// ---------- Swaps and giveaways ----------
function peerAnswer(id, yes) {
  const r = state.requests.find(x => x.id === id); if (!r || r.withId !== state.me || r.status !== 'offered') return;
  const at = new Date().toISOString();
  const patch = yes ? { status: 'pending', peerAt: at } : { status: 'declined', decidedAt: at };
  Object.assign(r, patch); render();
  saveDoc('requests/' + id, patch, true);
  toast(yes ? 'Swap accepted. It now goes to a manager for approval.' : 'Swap declined.');
}
function claimShift(id) {
  const r = state.requests.find(x => x.id === id), me = staffById(state.me);
  if (!r || !me || r.status !== 'offered') return;
  if (codeAt(me.id, r.date)) return toast('You already have a shift that day.');
  const patch = { status: 'pending', claimedBy: me.id, claimedAt: new Date().toISOString() };
  Object.assign(r, patch); render();
  saveDoc('requests/' + id, patch, true);
  toast('Shift claimed. A manager will approve the change.');
}

// ---------- Notifications ----------
// Built from shared data for whoever is Acting as; "new" means newer than when this viewer last opened the list.
const seenKey = () => 'seen:' + (state.me || 'manager');
function notifications() {
  const seen = ls.get(seenKey(), '');
  const me = staffById(state.me);
  const out = [];
  const add = (at, ttl, det, go) => out.push({ at: at || '', isNew: !!at && at > seen, ttl, det: det || '', go: go || '' });
  const nm = id => staffById(id)?.name || 'A teammate';
  if (state.canManage) {
    const pend = state.requests.filter(r => r.status === 'pending');
    if (pend.length) add(pend.map(r => r.peerAt || r.claimedAt || r.createdAt || '').sort().at(-1), `${pend.length} ${pend.length === 1 ? 'request is' : 'requests are'} waiting for approval`, 'Open shifts & requests', 'requests');
  }
  state.notes.filter(n => !n.until || n.until >= todayStr).forEach(n => add(n.at, 'Announcement', n.text));
  Object.entries(state.periods).forEach(([p, v]) => {
    const end = addDays(p, PERIOD_DAYS - 1); if (end < todayStr) return;
    const range = `${short(p)}–${short(end)}`;
    if (v.state === 'open' && (!v.until || v.until >= todayStr)) add(v.openedAt, `Self-scheduling is open for ${range}`, v.until ? `Pick your shifts in My schedule by ${nice(v.until)}` : 'Pick your shifts in My schedule', 'mine');
    if (v.state === 'posted' && v.postedAt) add(v.postedAt, `The ${range} schedule is posted`, '', 'mine');
  });
  if (me) {
    state.requests.forEach(r => {
      if (r.type === 'swap' && r.withId === me.id && r.status === 'offered') add(r.createdAt, `${nm(r.staffId)} wants to swap shifts on ${nice(r.date)}`, 'Accept or decline in My schedule', 'mine');
      if (r.staffId === me.id && r.decidedAt && r.status !== 'pending') add(r.decidedAt, `Your ${(REQ_TYPES[r.type] || 'shift').toLowerCase()} request for ${nice(r.date)} was ${r.status}`, '', 'mine');
      if (r.staffId === me.id && r.type === 'swap' && r.peerAt) add(r.peerAt, `${nm(r.withId)} accepted your swap for ${nice(r.date)}`, 'Now waiting for a manager', 'mine');
      if (r.staffId === me.id && r.type === 'giveaway' && r.claimedAt) add(r.claimedAt, `${nm(r.claimedBy)} claimed your ${nice(r.date)} shift`, 'Now waiting for a manager', 'mine');
    });
    claimable(me).forEach(r => add(r.createdAt, `${nm(r.staffId)} is giving away ${SHIFTS[r.code]?.label || 'a shift'}`, `${nice(r.date)} · claim it in My schedule`, 'mine'));
    state.changes.filter(c => c.staffId === me.id && postedChange(c) && !(c.by && c.by === state.myId)).forEach(c => add(c.at, `Your ${nice(c.date)} schedule changed`, `${SHIFTS[c.from]?.label || 'Off'} → ${SHIFTS[c.to]?.label || 'Off'}`, 'mine'));
    const opens = openShiftsFor(me).length;
    if (opens) add('', `${opens} open ${me.role} ${opens === 1 ? 'shift' : 'shifts'} you could pick up`, 'In the dates on screen', 'mine');
    (REQUIRED_CREDS[me.role] || []).forEach(cr => {
      const st = credStatus(me, cr, todayStr); if (st === 'ok') return;
      add('', st === 'missing' ? `No ${cr} on file` : st === 'exp' ? `Your ${cr} expired ${short(me.creds[cr])}` : `Your ${cr} expires ${short(me.creds[cr])}`, 'Give your manager the new card');
    });
  }
  return out.sort((a, b) => (b.isNew - a.isNew) || b.at.localeCompare(a.at));
}
function updateBell() {
  const n = notifications().filter(x => x.isNew).length;
  const b = document.getElementById('bellCount');
  b.hidden = !n; b.textContent = n > 9 ? '9+' : String(n);
  document.getElementById('bellBtn').setAttribute('aria-label', n ? `Notifications, ${n} new` : 'Notifications');
}
let notifEl = null;
function toggleNotif() {
  if (notifEl) { notifEl.remove(); notifEl = null; return; }
  const items = notifications(), who = staffById(state.me);
  notifEl = document.createElement('div'); notifEl.className = 'notif'; notifEl.setAttribute('role', 'dialog'); notifEl.setAttribute('aria-label', 'Notifications');
  notifEl.innerHTML = `<div class="panel-head"><h2>Notifications</h2><span class="sub">${who ? esc(who.name) : 'Manager view'}</span></div><ul class="list">${items.length ? items.map(n => `<li class="${n.isNew ? 'new' : ''}${n.go ? ' go' : ''}"${n.go ? ` data-go="${n.go}" tabindex="0"` : ''}><span class="mk" style="${n.isNew ? 'background:var(--accent)' : ''}"></span><div class="grow"><div class="ttl">${esc(n.ttl)}</div>${n.det ? `<div class="det">${esc(n.det)}</div>` : ''}</div></li>`).join('')
    : `<li class="det">Nothing new.${who ? '' : ' Pick your name under Acting as to see your own updates.'}</li>`}</ul>`;
  document.body.appendChild(notifEl);
  const r = document.getElementById('bellBtn').getBoundingClientRect();
  notifEl.style.top = (r.bottom + 8) + 'px';
  notifEl.style.left = Math.max(12, Math.min(window.innerWidth - notifEl.offsetWidth - 12, r.right - notifEl.offsetWidth)) + 'px';
  ls.set(seenKey(), new Date().toISOString()); updateBell();
}
function goTo(where) {
  if (where === 'requests' && state.canManage) state.view = 'requests';
  if (where === 'mine') { state.view = 'schedule'; state.schedMode = 'mine'; ls.set('schedMode', 'mine'); }
  ls.set('view', state.view); closePop(); render();
}

// ---------- Announcements ----------
function openAnnounceModal() {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="anTitle"><h2 id="anTitle">Post an announcement</h2>
    <form id="anForm"><div class="body">
      <label for="anText">Message<textarea id="anText" rows="4" maxlength="400" required placeholder="Census is high this weekend. Overtime is available on nights." style="font-family:var(--f-body);font-size:13px"></textarea></label>
      <label for="anUntil">Show until<input type="date" id="anUntil" value="${addDays(todayStr, 7)}" min="${todayStr}"></label>
      <p class="note">It shows at the top of everyone's board and in their notifications. Clear the date to keep it up until you delete it.</p>
    </div><div class="foot"><button type="button" class="btn" data-m="cancel">Cancel</button><button type="submit" class="btn primary">Post</button></div></form></div>`;
  document.body.appendChild(scrim); scrim.querySelector('#anText').focus();
  scrim.addEventListener('click', e => { if (e.target === scrim || e.target.dataset.m === 'cancel') scrim.remove(); });
  scrim.addEventListener('keydown', e => { if (e.key === 'Escape') scrim.remove(); });
  scrim.querySelector('#anForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = scrim.querySelector('#anText').value.trim(); if (!text) return;
    const id = 'n' + Date.now().toString(36) + uid().slice(0, 4);
    const doc = { text, at: new Date().toISOString(), until: scrim.querySelector('#anUntil').value || '', by: state.myId || '' };

// ---------- Repeating patterns ----------
// Tokens are the codes shown on the board (D, N, M, L8, EDU, LV, RDO…) or a shift's key letter; - leaves the day blank.
function parsePattern(text, role) {
  const bad = [];
  const seq = String(text).trim().toUpperCase().split(/[\s,]+/).filter(Boolean).map(t => {
    if (t === '-' || t === 'OFF') return '';
    const c = CODES.find(c => (SHIFTS[c].show || c).toUpperCase() === t && shiftOk(c, role) && c !== 'CO')
      || CODES.find(c => c === t && shiftOk(c, role) && c !== 'CO')
      || CODES.find(c => SHIFTS[c].key === t.toLowerCase() && shiftOk(c, role));
    if (!c) bad.push(t);
    return c || '';
  });
  return { seq, bad };
}
function openPatternModal() {
  if (!state.staff.length) return toast('Add staff first.');
  const days = visDays();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="ptTitle"><h2 id="ptTitle">Apply a repeating pattern</h2>
    <form id="ptForm"><div class="body">
      <div class="fields">
        <label for="ptWho">Staff member<select id="ptWho">${sortedStaff().map(s => `<option value="${esc(s.id)}" ${s.id === state.sel?.staffId ? 'selected' : ''}>${esc(s.name)} · ${esc(s.role)}</option>`).join('')}</select></label>
        <label for="ptSaved">Saved patterns<select id="ptSaved"><option value="">Type your own</option>${state.patterns.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></label>
      </div>
      <label for="ptSeq">Pattern<input type="text" id="ptSeq" placeholder="D D D - - - -" autocomplete="off"></label>
      <p class="hint">Type the codes on the board, separated by spaces: D, N, M, L8, CD, EDU, ADM, LV, RDO and so on. Use <b>-</b> for a day left blank. The pattern repeats from the start date.</p>
      <div class="fields">
        <label for="ptFrom">Start<input type="date" id="ptFrom" value="${days[0]}"></label>
        <label for="ptTo">Through<input type="date" id="ptTo" value="${days.at(-1)}"></label>
      </div>
      <label class="chk" for="ptReplace"><input type="checkbox" id="ptReplace"> Replace shifts already on the schedule</label>
      <p class="hint" id="ptPreview" aria-live="polite"></p>
      <div class="row-gap"><input type="text" id="ptName" placeholder="Name it to save, e.g. 3 on, 4 off" maxlength="40" style="flex:1;min-width:160px"><button type="button" class="btn small" data-m="save">Save pattern</button><button type="button" class="btn small danger" data-m="delpat" hidden>Delete saved</button></div>
    </div><div class="foot"><button type="button" class="btn" data-m="cancel">Cancel</button><button type="submit" class="btn primary">Apply</button></div></form></div>`;
  document.body.appendChild(scrim);
  const $ = q => scrim.querySelector(q);
  const plan = () => {
    const s = staffById($('#ptWho').value), from = $('#ptFrom').value, to = $('#ptTo').value;
    const { seq, bad } = parsePattern($('#ptSeq').value, s?.role);
    const out = { s, edits: [], skipped: 0, err: '' };
    if (!seq.length) return { ...out, err: 'Type a pattern, such as D D D - - - -.' };
    if (bad.length) return { ...out, err: `${bad.join(', ')} ${bad.length === 1 ? "isn't a shift" : "aren't shifts"} for ${s.role}.` };
    if (!from || !to || to < from) return { ...out, err: 'Check the start and through dates.' };
    if (diffDays(from, to) > 125) return { ...out, err: 'Pick 18 weeks or less.' };
    const dates = span(from, to);
    if (state.db && dates.some(d => !state.rowsBy[periodOf(d)])) return { ...out, err: 'Move the board to those dates first, so their current shifts are loaded.' };
    const replace = $('#ptReplace').checked;
    dates.forEach((d, i) => {
      const want = seq[i % seq.length], cur = codeAt(s.id, d);
      if (cur === want) return;
      if (!want) { if (replace) out.edits.push([d, '']); return; }
      if (cur && !replace) { out.skipped++; return; }
      out.edits.push([d, want]);
    });
    return out;
  };
  const preview = () => { const p = plan(); $('#ptPreview').textContent = p.err || `${p.edits.length} ${p.edits.length === 1 ? 'day' : 'days'} will change for ${p.s.name}${p.skipped ? `; ${p.skipped} kept because they already have a shift` : ''}.`; };
  scrim.addEventListener('input', preview); scrim.addEventListener('change', e => {
    if (e.target.id === 'ptSaved') { const sp = state.patterns.find(x => x.id === e.target.value); if (sp) { $('#ptSeq').value = sp.seq; $('#ptName').value = sp.name; } }
    $('[data-m=delpat]').hidden = !$('#ptSaved').value; preview();
  });
  $('#ptSeq').focus(); preview();
  const savePatterns = list => { state.patterns = list; saveDoc('config/patterns', { list }, false); };
  scrim.addEventListener('click', e => {
    const m = e.target.dataset.m;
    if (e.target === scrim || m === 'cancel') scrim.remove();
    if (m === 'save') {
      const name = $('#ptName').value.trim(), seq = $('#ptSeq').value.trim().replace(/\s+/g, ' ');
      if (!name || !seq) return toast('Type a pattern and a name to save it.');
      const old = state.patterns.find(x => x.name.toLowerCase() === name.toLowerCase());
      const item = { id: old ? old.id : 'p' + uid(), name, seq };
      savePatterns([...state.patterns.filter(x => x.id !== item.id), item]);
      $('#ptSaved').innerHTML = `<option value="">Type your own</option>${state.patterns.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}`;
      $('#ptSaved').value = item.id; $('[data-m=delpat]').hidden = false; toast(`Saved “${name}”.`);
    }
    if (m === 'delpat') {
      const id = $('#ptSaved').value; if (!id) return;
      savePatterns(state.patterns.filter(x => x.id !== id));
      $('#ptSaved').querySelector(`option[value="${CSS.escape(id)}"]`)?.remove(); $('#ptSaved').value = ''; e.target.hidden = true; toast('Saved pattern deleted.');
    }
  });
  scrim.addEventListener('keydown', e => { if (e.key === 'Escape') scrim.remove(); });
  $('#ptForm').addEventListener('submit', e => {
    e.preventDefault();
    const p = plan();
    if (p.err) return toast(p.err);
    if (!p.edits.length) return toast('Nothing to change: those days already match.');
    if (!state.canManage) return toast('Only managers can change the schedule.');
    p.edits.forEach(([d, c]) => setCell(p.s.id, d, c));
    scrim.remove(); toast(`Pattern applied: ${p.edits.length} ${p.edits.length === 1 ? 'day' : 'days'} changed for ${p.s.name}.`);
  });
}

// ---------- Export ----------
const csvCell = v => /[",\r\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
async function saveCsv(filename, rows) {
  const text = rows.map(r => r.map(v => csvCell(v ?? '')).join(',')).join('\r\n');
  if (window.claude && window.claude.use) {
    const dl = await window.claude.use('downloads');
    if (dl) { try { await dl.save({ filename, data: text }); return; } catch (e) { if (e && e.code === 'declined') return; } }
    try { await navigator.clipboard.writeText(text); toast('Saving files is not available here, so the CSV was copied. Paste it into a spreadsheet.'); } catch { toast('Could not save the file here.'); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportSchedule() {
  const days = visDays();
  const people = sortedStaff().filter(s => state.roleFilter === 'all' || s.role === state.roleFilter);
  saveCsv(`schedule-${days[0]}-to-${days.at(-1)}.csv`, [['Name', 'Role', 'FTE', ...days, 'Hours'],
    ...people.map(s => [s.name, s.role, s.fte, ...days.map(d => { const c = codeAt(s.id, d); return c ? (SHIFTS[c]?.show || c) : ''; }), hrsText(days.reduce((t, d) => t + workedHours(codeAt(s.id, d)), 0))])]);
}
function exportHours() {
  const p = rptPP();
  saveCsv(`hours-pay-period-${p}.csv`, [['Name', 'Role', 'FTE', 'FTE target', 'Worked', 'Overtime shifts', 'Education', 'Admin', 'Scheduled', 'vs target', 'Past 80h', 'Leave', 'Call-offs'],
    ...hoursRows(p).map(r => [r.s.name, r.s.role, r.s.fte, r.target, r.worked, r.ot, r.edu, r.adm, r.total, r.diff, r.over, r.leave, r.co])]);
}

// ---------- Toast ----------
let toastT;
function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3200);
}

boot();
})();
</script>
