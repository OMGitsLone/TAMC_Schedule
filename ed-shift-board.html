  }
  e.preventDefault();
  state.sel = { staffId: ns, date: nd };
  if (popEl) closePop();
  focusSel();
});

function submitRequest(r) {
  if (!state.me) return toast('Choose your name under Acting as first.');
  const id = 'r' + Date.now().toString(36) + uid().slice(0, 4);
  const doc = { type: r.type, staffId: state.me, date: r.date, status: 'pending', createdAt: new Date().toISOString() };
  if (r.code) doc.code = r.code;
  if (r.until) doc.until = r.until;
  if (r.withId) doc.withId = r.withId;
  if (r.note) doc.note = r.note;
  state.requests = [...state.requests, { id, ...doc }];
  render(); toast('Request sent to the charge nurse and manager.');
  saveDoc('requests/' + id, doc, false);
}
async function decide(id, status) {
  const r = state.requests.find(x => x.id === id); if (!r) return;
  r.status = status; render();
  saveDoc('requests/' + id, { status, decidedAt: new Date().toISOString() }, true);
  if (status !== 'approved') { toast('Request denied.'); return; }
  if (r.type === 'pickup') await setCell(r.staffId, r.date, r.code || 'D');
  if (r.type === 'timeoff') {
    const n = Math.min(30, diffDays(r.date, r.until || r.date));
    for (let i = 0; i <= n; i++) await setCell(r.staffId, addDays(r.date, i), r.code || 'PTO');
  }
  if (r.type === 'swap') {
    const a = codeAt(r.staffId, r.date), b = codeAt(r.withId, r.date);
    await setCell(r.staffId, r.date, b); await setCell(r.withId, r.date, a);
  }
  toast('Approved and added to the schedule.');
}

// ---------- Bulk import ----------
const normKey = s => String(s || '').trim().toLowerCase().replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ');
const IMPORT_HEADERS = {
  name: ['name', 'full name', 'staff', 'staff name', 'employee', 'employee name'],
  first: ['first', 'first name', 'given name'],
  last: ['last', 'last name', 'surname', 'family name'],
  role: ['role', 'position', 'job', 'title', 'job title'],
  fte: ['fte'],
  pref: ['pref', 'preference', 'shift', 'shift preference', 'preferred shift']
};
ALL_CREDS.forEach(c => { const k = c.toLowerCase(); IMPORT_HEADERS[c] = [k, k + ' exp', k + ' expiry', k + ' expires', k + ' expiration']; });
const DEFAULT_ORDER = ['name', 'role', 'fte', 'pref', ...ALL_CREDS];
const ROLE_ALIASES = {
  'charge': 'RN', 'charge nurse': 'RN', 'charge rn': 'RN', 'rn': 'RN', 'nurse': 'RN', 'registered nurse': 'RN',
  'medic': 'Medic', 'paramedic': 'Medic', 'emt': 'Medic', 'ed tech': 'Medic', 'msa': 'MSA', 'unit secretary': 'MSA',
  'admin': 'Admin', 'administrative': 'Admin', 'supply': 'Supply', 'dispatcher': 'Dispatcher', 'dispatch': 'Dispatcher',
  'lpn': 'LPN', 'lvn': 'LPN', 'licensed practical nurse': 'LPN', 'pa': 'PA', 'pa c': 'PA', 'physician assistant': 'PA', 'physician associate': 'PA',
  'doctor': 'Doctor', 'physician': 'Doctor', 'md': 'Doctor', 'm d': 'Doctor', 'do': 'Doctor', 'd o': 'Doctor', 'attending': 'Doctor', 'ed physician': 'Doctor'
};
const PREFS = { '': '', 'day': 'Days', 'days': 'Days', 'night': 'Nights', 'nights': 'Nights', 'mid': 'Mids', 'mids': 'Mids', 'swing': 'Mids', 'swings': 'Mids', 'rotating': 'Rotating', 'rotate': 'Rotating', 'any': '', 'none': '', 'no preference': '' };

// Handles spreadsheet pastes (tabs) and CSV files (commas or semicolons, quoted cells).
function parseDelimited(text) {
  text = text.replace(/^﻿/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = first.includes('\t') ? '\t' : first.split(';').length > first.split(',').length ? ';' : ',';
  const rows = []; let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') quoted = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
}
function parseDate(s) {
  let m, y, mo, d;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, mo, d] = m.map(Number);
  else if ((m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2}|\d{4})$/))) { [, mo, d, y] = m.map(Number); if (y < 100) y += 2000; }
  else return null;
  const dt = new Date(Date.UTC(y, mo - 1, d));
  return dt.getUTCMonth() === mo - 1 && dt.getUTCDate() === d ? fmt(dt) : null;
}
function analyzeImport(text) {
  const rows = parseDelimited(text);
  if (!rows.length) return { rows: [], header: false };
  let map = {};
  rows[0].forEach((c, i) => { const k = normKey(c); for (const [f, al] of Object.entries(IMPORT_HEADERS)) if (al.includes(k) && map[f] == null) map[f] = i; });
  const header = map.name != null || map.first != null;
  if (!header) { map = {}; DEFAULT_ORDER.forEach((f, i) => map[f] = i); }
  const byName = new Map(state.staff.map(s => [String(s.name).trim().toLowerCase(), s]));
  const seen = new Set();
  return { header, rows: (header ? rows.slice(1) : rows).map((r, idx) => {
    const get = f => map[f] != null ? (r[map[f]] || '').trim() : '';
    const errors = [];
    const name = (get('name') || [get('first'), get('last')].filter(Boolean).join(' ')).replace(/\s+/g, ' ');
    if (!name) errors.push('Name is missing.');
    const rawRole = get('role');
    const role = ROLE_ALIASES[normKey(rawRole)] || ROLES.find(x => x.toLowerCase() === normKey(rawRole));
    if (!rawRole) errors.push('Role is missing.');
    else if (!role) errors.push(`“${rawRole}” is not a role. Use ${ROLES.join(', ')}.`);
    let fte = null;
    const rawFte = get('fte').replace('%', '');
    if (rawFte) {
      let v = parseFloat(rawFte); if (v > 1 && v <= 100) v /= 100;
      if (v >= 0.1 && v <= 1) fte = Math.round(v * 100) / 100; else errors.push(`FTE “${get('fte')}” must be between 0.1 and 1.0.`);
    }
    const pref = PREFS[normKey(get('pref'))];
    if (pref === undefined) errors.push(`Preference “${get('pref')}” should be Days, Nights, Mids or Rotating.`);
    const creds = {};
    ALL_CREDS.forEach(c => {
      const v = get(c); if (!v) return;
      const d = parseDate(v);
      if (d) creds[c] = d; else errors.push(`${c} date “${v}” isn't a date. Use YYYY-MM-DD or MM/DD/YYYY.`);
    });
    const key = name.toLowerCase();
    if (name && seen.has(key)) errors.push('This name is listed more than once.');
    seen.add(key);
    return { line: idx + (header ? 2 : 1), name, role, fte, pref, creds, errors, existing: byName.get(key) };
  }) };
}

        + (r.errors.length ? `<tr class="err"><td></td><td colspan="6">${r.errors.map(esc).join(' ')}</td></tr>` : '');

      + `<div class="tbl-wrap imp"><table class="staff"><thead><tr><th>Row</th><th>Status</th><th>Name</th><th>Role</th><th>FTE</th><th>Preference</th><th>Certifications</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>`;

// ---------- Toast ----------
let toastT;
